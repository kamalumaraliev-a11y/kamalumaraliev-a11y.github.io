        return '<button class="chip" data-mode="' + m[0] + '" aria-pressed="' + ((state.mode||"night")===m[0]) + '">' + m[1] + '</button>'; }).join("") + '</div>' +
      '<div class="sh"><b>Day rolls over at</b></div><div class="chips">' + [0,3,4,5,6].map(function(hh){
        return '<button class="chip" data-ds="' + hh + '" aria-pressed="' + ((state.dayStart||4)===hh) + '">' + (hh===0?"midnight":hh + "am") + '</button>'; }).join("") + '</div>' +
      '<div class="sh"><b>Life areas</b></div><p class="quiet" style="margin:0 0 8px">Used to group goals.</p>' +
      '<input class="in" id="sareas" value="' + esc(state.areas.join(", ")) + '">' +
      '<div class="sh"><b>Backups</b><span class="sp"></span><span>' + (state.lastBackup ? "last: " + dayTitle(state.lastBackup) : "never backed up") + '</span></div>' +
      '<p class="quiet" style="margin:0 0 10px">Everything lives in this browser. Text backup carries all your data; the file backup carries your pictures too.</p>' +
      '<button class="btn wide" id="backup">Copy a backup (text)</button>' +
      '<button class="btn wide" id="restore">Restore from text</button>' +
      '<button class="btn wide" id="backupfile">Save a full backup file (with pictures)</button>' +
      '<button class="btn wide" id="restorefile">Load a backup file</button>' +
      '<div class="sh"><b>How this works</b></div>' +
      '<p class="quiet">Your day rolls over at ' + ((state.dayStart||4)===0?"midnight":(state.dayStart||4)+"am") + ', so a late night still counts as the same day. A day counts toward your streak when you clear at least one thing and finish 60% of the board.</p>' +
      '<div class="sh"><b>Version</b><span class="sp"></span><button class="hb" id="supd">Check for update</button></div><p class="quiet">Build <b>' + BUILD + '</b> · ' + state.tasks.length + ' tasks · ' + state.goals.length + ' goals · ' + state.habits.length + ' habits · ' + state.notes.length + ' notes.</p>' +
      '<div class="sheetbtns"><button class="ghost" data-close="1">Close</button><button class="solid" id="ssave">Save</button></div>';
    w.querySelectorAll("[data-close]").forEach(function(x){ x.onclick = function(){ w.remove(); }; });
    var upb = w.querySelector("#supd");
    if(upb) upb.onclick = function(){ toast("Checking\u2026"); checkUpdate(true); };
    w.querySelector("#ssave").onclick = function(){
      state.name = w.querySelector("#sname").value.trim().slice(0,24);
      var a = w.querySelector("#sareas").value.split(",").map(function(s){ return s.trim(); }).filter(Boolean).slice(0,12);
      if(a.length) state.areas = a;
      state.onboarded = true; save(); pageClose(w); render(); toast("Saved.");
    };
    w.querySelector("#backup").onclick = function(){
      try{ navigator.clipboard.writeText(JSON.stringify(state)).then(function(){ state.lastBackup = TODAY; save(); toast("Backup copied — paste it somewhere safe."); }, function(){ toast("Couldn't copy."); }); }catch(e){ toast("Couldn't copy."); }
    };
    w.querySelector("#restore").onclick = function(){
      sheetOpen('<h2>Restore from text</h2><p>Paste a backup. This replaces everything currently in the app.</p><textarea class="in" id="rin" style="min-height:120px"></textarea>' +
        '<div class="sheetbtns"><button class="ghost" data-close="1">Cancel</button><button class="solid" id="rgo">Restore</button></div>',
        function(sw){ sw.querySelector("#rgo").onclick = function(){
          var raw = sw.querySelector("#rin").value.trim(); if(!raw) return;
          try{ var p = JSON.parse(raw); Object.keys(state).forEach(function(k){ delete state[k]; }); Object.assign(state, p); migrate(); save(); sw.remove(); pageClose(w); render(); toast("Restored."); }
          catch(e){ toast("That doesn't look like a backup."); }
        }; });
    };
    w.querySelector("#backupfile").onclick = function(){ backupFile(); };
    w.querySelector("#restorefile").onclick = function(){
      var inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json,.json"; inp.style.cssText = "position:fixed;left:-9999px";
      inp.onchange = function(){
        var f = inp.files && inp.files[0]; if(!f){ inp.remove(); return; }
        var fr = new FileReader();
        fr.onload = function(){
          try{
            var pack = JSON.parse(String(fr.result));
            if(!pack || !pack.state) throw 0;
            Object.keys(state).forEach(function(k){ delete state[k]; }); Object.assign(state, pack.state); migrate();
            (pack.shots||[]).forEach(function(r){ shotPut(r); });
            save(); pageClose(w); render(); toast("Restored with pictures.");
          }catch(e){ toast("That file isn't a Momentum backup."); }
          inp.remove();
        };
        fr.onerror = function(){ toast("Couldn't read that file."); inp.remove(); };
        fr.readAsText(f);
      };
      document.body.appendChild(inp); inp.click();
    };
    w.addEventListener("click", function(ev){
      var b = ev.target.closest("[data-acc],[data-mode],[data-ds]"); if(!b) return;
      var d = b.dataset;
      if(d.acc) state.accent = d.acc;
      if(d.mode) state.mode = d.mode;
      if(d.ds != null) state.dayStart = +d.ds;
      save(); applyTheme(); paint();
    });
  }
  paint();
}

/* ================= ROUTER ================= */
var tab = "home", sub = "";
var TABS = ["home","tasks","goals","habits","more"];
function go(where){
  if(TABS.indexOf(where) > -1){ tab = where; sub = ""; }
  else { tab = "more"; sub = where; }
  window.scrollTo(0,0); render();
}
function drawTop(){
  var ds = document.getElementById("datestr"); if(ds) ds.textContent = longDate(TODAY);
  var st = streakCount(), el = document.getElementById("streak");
  if(el){ el.textContent = st ? st + (st===1?" day":" days") + " 🔥" : "no streak yet"; el.className = "pill" + (st?"":" cold"); }
}
function render(){
  applyTheme(); drawTop();
  var v = document.getElementById("view");
  var html;
  if(tab === "home") html = viewHome();
  else if(tab === "tasks") html = viewTasks();
  else if(tab === "goals") html = viewGoals();
  else if(tab === "habits") html = viewHabits();
  else {
    if(sub === "calendar") html = viewCalendar();
    else if(sub === "journal") html = viewJournal();
    else if(sub === "focus") html = viewFocus();
    else if(sub === "stats") html = viewStats();
    else if(sub === "notes") html = viewNotes();
    else if(sub === "inbox") html = viewInbox();
    else if(sub === "projects") html = viewProjects();
    else if(sub === "review") html = viewReview();
    else if(sub === "badges") html = viewBadges();
    else if(sub === "templates") html = viewTemplates();
    else html = viewMore();
    if(sub) html = '<button class="btn sm mb" data-go="more">‹ More</button>' + html;
  }
  v.innerHTML = html;
  document.querySelectorAll('.nav [role="tab"]').forEach(function(b){ b.setAttribute("aria-selected", String(b.dataset.tab === tab)); });
  if(timer.running) paintClock();
  if(goalRepaint) goalRepaint();
}

/* ================= EVENTS ================= */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-toggle],[data-more],[data-open],[data-hopen],[data-fold],[data-go],[data-tview],[data-tlen],[data-tpick]," +
    "[data-gopen],[data-gpage],[data-gopenpage],[data-garea],[data-glog],[data-addshot],[data-vopen],[data-panelmile],[data-day],[data-dp],[data-cm]," +
    "[data-note],[data-proj],[data-ibt],[data-ibx],[data-inbox],[data-tplrun],[data-tpldel],[data-tplopen]," +
    "[role='tab'],#fab,#gear,#searchbtn,#qaddbtn,#qaddbtn2,#onebtn,#rethink,#namebtn,#obgoalbtn,#obskipg,#obhabbtn,#obskiph,#backupnow,#backuplater,#endday,#copyday,#pullall,#tstart,#treset,#moredays,[data-obgoal],[data-obhab]," +
    "#visionbtn,#tfilter,#clearf,#newnote,#newproj,#newtpl,#jsave,#rsave2,#ibadd,#noteq,#moredays,#checkupd");
  if(!el) return;
  var d = el.dataset;
  if(el.getAttribute("role") === "tab" && d.tab){ go(d.tab); return; }
  if(d.go){
    if(d.go === "board"){ openBoard(); return; }
    if(d.go === "settings"){ openSettings(); return; }
    go(d.go); return;
  }
  if(d.toggle){ toggle(d.toggle, d.kind); return; }
  if(d.more){ openRowMenu(d.more, d.kind); return; }
  if(d.open){ openTask(d.open); return; }
  if(d.hopen){ openHabitStats(d.hopen); return; }
  if(d.fold){ foldSt[d.fold] = !foldSt[d.fold]; render(); return; }
  if(d.tview){ taskView = d.tview; render(); return; }
  if(d.tlen != null){ if(!timer.running){ timer.mode = +d.tlen === 5 ? "break" : "focus"; timer.len = (+d.tlen)*60; timer.left = timer.len; } render(); return; }
  if(d.tpick != null){ timer.taskId = d.tpick; render(); return; }
  if(d.gopen){ expandedGoal = expandedGoal === d.gopen ? null : d.gopen; render(); return; }
  if(d.gpage){ openGoal(d.gpage); return; }
  if(d.gopenpage){ openGoal(d.gopenpage); return; }
  if(d.garea != null){ goalArea = d.garea; render(); return; }
  if(d.glog){ openLog(d.glog); return; }
  if(d.addshot){ addShot(d.addshot); return; }
  if(d.vopen){ openViewer(d.vopen, 0); return; }
  if(d.panelmile){
    var pr = d.panelmile.split(":"), gg = byId(state.goals, pr[0]);
    if(gg){ (gg.miles||[]).forEach(function(m){ if(m.id === pr[1]){ m.done = !m.done; m.d = m.done ? TODAY : ""; } }); checkBadges(); save(); render(); }
    return;
  }
  if(d.day){ openDay = openDay === d.day ? null : d.day; render(); return; }
  if(d.dp){ dayPick = d.dp; render(); return; }
  if(d.cm != null){
    var base = calMonth || TODAY.slice(0,7) + "-01";
    if(+d.cm === 0){ calMonth = null; dayPick = TODAY; }
    else { var dd2 = new Date(base+"T12:00:00"); dd2.setMonth(dd2.getMonth() + (+d.cm)); calMonth = fmtKey(new Date(dd2.getFullYear(), dd2.getMonth(), 1)); }
    render(); return;
  }
  if(d.note){ openNote(d.note); return; }
  if(d.proj){ openProject(d.proj); return; }
  if(d.ibt){
    var it = byId(state.inbox, d.ibt); if(!it) return;
    state.tasks.push({ id:uid(), title:it.t, date:TODAY, time:"", goalId:"", projectId:"", tags:[], subs:[], pri:0, star:false, notes:"", done:false, createdDay:TODAY });
    state.inbox = state.inbox.filter(function(x){ return x.id !== d.ibt; });
    checkBadges(); save(); render(); toast("Now a task for today."); return;
  }
  if(d.ibx){ state.inbox = state.inbox.filter(function(x){ return x.id !== d.ibx; }); checkBadges(); save(); render(); return; }
  if(d.inbox){ go("inbox"); return; }
  if(d.tplrun){
    var tp = byId(state.templates, d.tplrun); if(!tp) return;
    tp.items.forEach(function(s){ state.tasks.push({ id:uid(), title:s, date:TODAY, time:"", goalId:"", projectId:"", tags:[], subs:[], pri:0, star:false, notes:"", done:false, createdDay:TODAY }); });
    save(); render(); toast(tp.items.length + " added to today."); return;
  }
  if(d.tplopen){ openTemplateEdit(d.tplopen); return; }
  if(d.tpldel){ confirmSheet("Delete routine?", "The routine goes; tasks you already added stay.", "Delete", function(){
    state.templates = state.templates.filter(function(x){ return x.id !== d.tpldel; }); save(); render(); }, true); return; }
  var id = el.id;
  if(id === "fab"){ openAdd(tab === "goals" ? "goal" : tab === "habits" ? "habit" : sub === "notes" ? "note" : sub === "projects" ? "project" : "task", sub === "calendar" ? dayPick : ""); return; }
  if(id === "gear"){ openSettings(); return; }
  if(id === "searchbtn"){ openSearch(); return; }
  if(id === "qaddbtn" || id === "qaddbtn2"){ quickAdd2(); return; }
  if(id === "tfilter"){ openTaskFilter(); return; }
  if(id === "clearf"){ taskFilter = { tag:"", proj:"", goal:"", pri:0, q:"" }; render(); return; }
  if(id === "visionbtn"){ openBoard(); return; }
  if(id === "newnote"){ openNote(null); return; }
  if(id === "newproj"){ openProjectEdit(null); return; }
  if(id === "newtpl"){ openTemplateEdit(null); return; }
  if(id === "onebtn"){ var oi = document.getElementById("onein"); var v = oi ? oi.value.trim() : ""; if(!v) return; state.oneThing[TODAY] = v.slice(0,120); save(); render(); return; }
  if(id === "rethink"){ delete state.oneThing[TODAY]; save(); render(); return; }
  if(el.dataset && el.dataset.obgoal != null){ obDraft.goal = el.dataset.obgoal; var gI = document.getElementById("obg"); if(gI) gI.value = obDraft.goal; document.querySelectorAll("[data-obgoal]").forEach(function(c){ c.setAttribute("aria-pressed", String(c === el)); }); return; }
  if(el.dataset && el.dataset.obhab != null){ obDraft.habit = el.dataset.obhab; var hI = document.getElementById("obh"); if(hI) hI.value = obDraft.habit; document.querySelectorAll("[data-obhab]").forEach(function(c){ c.setAttribute("aria-pressed", String(c === el)); }); return; }
  if(id === "namebtn"){ var ni = document.getElementById("namein"); obDraft.name = (ni ? ni.value.trim() : ""); obStep = 2; render(); return; }
  if(id === "obgoalbtn"){ var gi = document.getElementById("obg"); obDraft.goal = (gi ? gi.value.trim() : obDraft.goal); obStep = 3; render(); return; }
  if(id === "obskipg"){ obDraft.goal = ""; obStep = 3; render(); return; }
  if(id === "obhabbtn"){ var hi = document.getElementById("obh"); obDraft.habit = (hi ? hi.value.trim() : obDraft.habit); obFinish(); return; }
  if(id === "obskiph"){ obDraft.habit = ""; obFinish(); return; }
  if(id === "backupnow"){ backupFile(); return; }
  if(id === "backuplater"){ state.backupSnooze = shiftKey(TODAY, 7); save(); render(); toast("I'll ask again in a week."); return; }
  if(id === "endday"){ openRecap(); return; }
  if(id === "copyday"){ copyDay(); return; }
  if(id === "checkupd"){ toast("Checking\u2026"); checkUpdate(true); return; }
  if(id === "pullall"){
    var late = lateTasks(), was = late.map(function(t){ return { t:t, d:t.date }; });
    late.forEach(function(t){ t.date = TODAY; }); save(); render();
    undoToast(late.length + " moved to today", function(){ was.forEach(function(r){ r.t.date = r.d; }); save(); render(); });
    return;
  }
  if(id === "tstart"){ timerToggle(); return; }
  if(id === "treset"){ timerReset(); return; }
  if(id === "moredays"){ histLimit += 20; render(); return; }
  if(id === "jsave"){
    var jt = document.getElementById("jtext"), jg = document.getElementById("jgrat");
    var j = state.journal[TODAY] || {};
    j.text = jt ? jt.value.slice(0,5000) : ""; j.grat = jg ? jg.value.trim().slice(0,160) : "";
    if(!j.text && !j.grat && !j.mood && !j.energy){ toast("Write something first."); return; }
    state.journal[TODAY] = j; checkBadges(); save(); render(); toast("Entry saved."); return;
  }
  if(id === "rsave2"){
    var wk = weekKey(TODAY);
    state.reviews[wk] = { well:(document.getElementById("rw")||{}).value||"", bad:(document.getElementById("rb")||{}).value||"", next:(document.getElementById("rn")||{}).value||"", d:TODAY };
    checkBadges(); save(); render(); toast("Review saved. Good reset."); return;
  }
  if(id === "ibadd"){
    var ii = document.getElementById("ibin"); var v2 = ii ? ii.value.trim().slice(0,200) : "";
    if(!v2){ if(ii){ ii.classList.add("nudgeme"); ii.focus(); setTimeout(function(){ ii.classList.remove("nudgeme"); }, 500); } toast("Write it down first."); return; }
    state.inbox.push({ id:uid(), t:v2, d:TODAY }); state.inboxUsed = true; save(); render(); toast("Captured."); return;
  }
});
document.addEventListener("input", function(e){
  if(e.target.id === "noteq"){ noteQ = e.target.value; var v = document.getElementById("view"); var pos = e.target.selectionStart; render();
    var n = document.getElementById("noteq"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } }
});
document.addEventListener("click", function(e){
  var b = e.target.closest("#jmood [data-m], #jen [data-en]"); if(!b) return;
  var j = state.journal[TODAY] || {};
  if(b.dataset.m) j.mood = j.mood === b.dataset.m ? "" : b.dataset.m;
  if(b.dataset.en) j.energy = j.energy === +b.dataset.en ? 0 : +b.dataset.en;
  var jt = document.getElementById("jtext"); if(jt) j.text = jt.value;
  state.journal[TODAY] = j; save();
  b.parentNode.querySelectorAll("[data-m],[data-en]").forEach(function(c){
    c.setAttribute("aria-pressed", String((c.dataset.m && c.dataset.m === j.mood) || (c.dataset.en && +c.dataset.en === j.energy)));
  });
});
document.addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  var id = e.target.id;
  if(id === "qadd"){ e.preventDefault(); quickAdd2(); }
  if(id === "onein"){ e.preventDefault(); var b = document.getElementById("onebtn"); if(b) b.click(); }
  if(id === "namein"){ e.preventDefault(); var b2 = document.getElementById("namebtn"); if(b2) b2.click(); }
  if(id === "ibin"){ e.preventDefault(); var b3 = document.getElementById("ibadd"); if(b3) b3.click(); }
  if(id === "gnewmile" || id === "gnewnote" || id === "gnewtask" || id === "newsub" || id === "pnew"){
    e.preventDefault();
    var map = { gnewmile:"[data-mileadd]", gnewnote:"[data-noteadd]", gnewtask:"[data-gadd]", newsub:"[data-subadd]", pnew:"[data-padd]" };
    var btn = document.querySelector(".page " + map[id]); if(btn) btn.click();
  }
});
function quickAdd2(){
  var el = document.getElementById("qadd"); if(!el) return;
  if(sub === "calendar" && tab === "more"){
    var v = el.value.trim().slice(0,200);
    if(!v){ el.classList.add("nudgeme"); toast("Type the task first."); setTimeout(function(){ el.classList.remove("nudgeme"); }, 500); el.focus(); return; }
    var p = parseQuick(v); p.date = dayPick;
    state.tasks.push({ id:uid(), title:p.title||v, date:dayPick, time:"", goalId:"", projectId:"", tags:p.tags, subs:[], pri:p.pri, star:p.star, notes:"", done:false, createdDay:TODAY });
    el.value = ""; checkBadges(); save(); render(); toast("Added to " + dayTitle(dayPick) + ".");
    return;
  }
  quickAdd();
}
var recovering = false;
window.addEventListener("error", function(){
  if(recovering) return; recovering = true;
  setTimeout(function(){ recovering = false; }, 4000);
  try{ document.querySelectorAll(".page,.viewer,.scrim,.party").forEach(function(n){ n.remove(); });
    pageStack = []; goalRepaint = null; syncChrome(); render(); toast("Recovered — your data is safe."); }catch(e){}
});

/* ================= UPDATES ================= */
function liveBuild(){
  return fetch("sw.js?ts=" + Date.now(), { cache:"no-store" })
    .then(function(r){ return r.text(); })
    .then(function(t){ var m = t.match(/momentum-(v[0-9]+)/); return m ? m[1] : null; })
    .catch(function(){ return null; });
}
function hardRefresh(){
  var done = function(){ try{ location.reload(); }catch(e){} };
  try{
    if(window.caches && caches.keys){
      caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })
        .then(done, done);
      return;
    }
  }catch(e){}
  done();
}
function checkUpdate(loud){
  return liveBuild().then(function(v){
    if(!v){ if(loud) toast("Couldn't reach the server."); return false; }
    if(v === BUILD){ if(loud) toast("You're on the newest version (" + BUILD + ")."); return false; }
    if(loud){
      confirmSheet("Update available", "You're running " + BUILD + " and " + v + " is out. Updating reloads the app \u2014 your data stays exactly as it is.", "Update now", hardRefresh);
    } else {
      var seen = "";
      try{ seen = sessionStorage.getItem("mom-upd") || ""; }catch(e){}
      if(seen !== v){
        try{ sessionStorage.setItem("mom-upd", v); }catch(e){}
        toast("Version " + v + " available \u2014 updating\u2026");
        setTimeout(hardRefresh, 1200);
      }
    }
    return true;
  });
}

/* ================= BOOT ================= */
function rollover(){
  var t = todayKey();
  if(t !== TODAY){
    if(!state.history[TODAY]){ var s = todayStats(); if(s.total) state.history[TODAY] = { done:s.done, total:s.total, rate:s.rate, note:"" }; }
    TODAY = t; save();
  }
  state.lastActive = TODAY;
}
function boot(){
  load(); applyTheme();
  var t = todayKey();
  if(state.lastActive && state.lastActive !== t && !state.history[state.lastActive]){
    // day changed while away — no stats snapshot needed, history stays as written on close-out
  }
  state.lastActive = t; TODAY = t;
  var st = streakCount(); if(st > (state.bestStreak||0)) state.bestStreak = st;
  render();
  shotsLoad().then(function(){ render(); });
  checkBadges(); save();
  window.addEventListener("popstate", function(){
    if(pageStack.length){ closeTopPage(); history.pushState({ p:1 }, ""); }
  });
  try{ history.pushState({ p:1 }, ""); }catch(e){}
  setInterval(rollover, 60000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden){ rollover(); render(); checkUpdate(false); } });
  if("serviceWorker" in navigator){
    try{ navigator.serviceWorker.register("sw.js").then(function(reg){ try{ reg.update(); }catch(e){} }); }catch(e){}
  }
  setTimeout(function(){ checkUpdate(false); }, 1500);
}
boot();
})();
