<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Momentum</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momentum">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2312151F'/%3E%3Ccircle cx='90' cy='90' r='52' fill='none' stroke='%23F0B26B' stroke-width='14'/%3E%3Ccircle cx='90' cy='90' r='16' fill='%23F0B26B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12151F; --ink-2:#0D1018; --card:#1B2030; --card-2:#242B3E; --card-3:#2C3448; --line:#2E3750; --line-2:#3A4460;
    --text:#EAEDF6; --soft:#C6CCDF; --dim:#8A93AD; --mute:#5E6780;
    --amber:#F0B26B; --amber-soft:rgba(240,178,107,.14); --amber-line:rgba(240,178,107,.32); --on-amber:#1A1408;
    --mint:#5AC79E; --mint-soft:rgba(90,199,158,.14); --blue:#8CA2E8; --blue-soft:rgba(140,162,232,.14);
    --red:#E88C8C; --red-soft:rgba(232,140,140,.14); --violet:#B79CF0; --violet-soft:rgba(183,156,240,.14);
    --p1:#E88C8C; --p2:#F0B26B; --p3:#8CA2E8;
    --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --r:16px; --r-s:11px; --r-l:22px;
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  }
  html[data-mode="dim"]{ --ink:#171B27; --ink-2:#121520; --card:#202637; --card-2:#2A3145; --card-3:#333B52; --line:#353E58; --line-2:#414B69 }
  html[data-mode="midnight"]{ --ink:#07090F; --ink-2:#04050A; --card:#0F131D; --card-2:#171C29; --card-3:#1F2535; --line:#1F2637; --line-2:#2A3246 }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{margin:0; padding:0; width:100%; overflow-x:hidden; background:var(--ink); -webkit-text-size-adjust:100%}
  body{margin:0; padding:0; width:100%; min-height:100%; overflow-x:clip; font-family:var(--body); color:var(--text); touch-action:manipulation;
    background:
      radial-gradient(120% 60% at 15% -5%, rgba(240,178,107,.10), transparent 55%),
      radial-gradient(100% 55% at 110% 15%, rgba(183,156,240,.09), transparent 55%),
      radial-gradient(90% 50% at 50% 115%, rgba(90,199,158,.06), transparent 60%),
      var(--ink);
    background-attachment:fixed}
  #app{min-height:calc(100dvh + 2px); max-width:640px; margin:0 auto; padding:calc(12px + var(--sat)) 16px calc(100px + var(--sab))}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; font-size:inherit; padding:0}
  input,select,textarea{font-family:inherit; font-size:16px; color:var(--text)}
  textarea{resize:vertical}
  ::placeholder{color:var(--mute)}
  h1,h2,h3,h4{font-family:var(--display); font-weight:700; letter-spacing:-.01em; margin:0}
  a{color:var(--amber)}
  .quiet{font-size:13px; color:var(--dim)}
  .hide{display:none!important}
  .row{display:flex; align-items:center; gap:10px}
  .grow{flex:1; min-width:0}
  .mt{margin-top:12px} .mb{margin-bottom:12px} .tc{text-align:center}
  :is(button,input,select,textarea):focus-visible{outline:2px solid var(--amber); outline-offset:1px}
  @media(prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }

  /* ---------- header ---------- */
  .top{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .wordmark{font-family:var(--display); font-weight:800; font-size:24px; line-height:1; letter-spacing:-.02em;
    background:linear-gradient(92deg, var(--text) 30%, var(--amber) 85%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .wordmark span{color:var(--amber)}
  .topdate{font-size:13px; color:var(--dim); padding-top:3px}
  .pill{font-size:12.5px; color:var(--amber); background:var(--amber-soft); border:1px solid var(--amber-line); padding:5px 10px; border-radius:99px; white-space:nowrap}
  .pill.cold{color:var(--dim); background:none; border-color:var(--line)}
  .ibtn{width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--soft); flex:0 0 auto}
  .ibtn svg{width:18px; height:18px}
  .ibtn.on{background:var(--amber-soft); border-color:var(--amber-line); color:var(--amber)}

  /* ---------- page titles ---------- */
  .ph{display:flex; align-items:flex-end; gap:10px; margin:4px 2px 18px}
  .ph h1{font-size:34px; line-height:1.02; flex:1; letter-spacing:-.025em}
  .ph .sub{font-size:13px; color:var(--dim); margin-top:6px}
  .ph .act{display:flex; gap:6px}

  /* ---------- cards ---------- */
  .card{background:linear-gradient(180deg, var(--card-2), var(--card) 42%); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; margin-bottom:14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.045), 0 10px 26px rgba(0,0,0,.24)}
  .card.grad{background:linear-gradient(165deg,var(--card-2),var(--card))}
  .card.flat{padding:0; overflow:hidden}
  .card h2{font-size:18px; margin-bottom:6px}
  .card p{margin:0; font-size:14px; line-height:1.5; color:var(--soft)}
  .card .when{font-size:12.5px; color:var(--amber); margin-bottom:5px; font-weight:600; letter-spacing:.02em}
  .card .when.b{color:var(--blue)} .card .when.m{color:var(--mint)} .card .when.v{color:var(--violet)}
  .kicker{font-size:11.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; font-weight:600}

  /* ---------- section heads ---------- */
  .sec{margin-bottom:26px}
  .sh{display:flex; align-items:baseline; gap:8px; margin:0 2px 8px}
  .sh b{font-family:var(--display); font-size:16.5px; font-weight:700; color:var(--text); letter-spacing:-.01em}
  .sh span{font-size:12.5px; color:var(--dim)}
  .sh .sp{flex:1}
  .sh .hb{font-size:12.5px; color:var(--amber); padding:2px 4px; font-weight:600}

  /* ---------- folds ---------- */
  .fold{background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin-bottom:10px; overflow:hidden}
  .foldrow{display:flex; align-items:center; padding-right:10px}
  .foldhead{display:flex; align-items:center; gap:10px; flex:1; min-width:0; text-align:left; padding:14px 15px}
  .foldhead b{font-family:var(--display); font-weight:700; font-size:16.5px; flex:1; min-width:0}
  .foldhead .cnt{font-size:13px; color:var(--dim); font-weight:500; white-space:nowrap}
  .foldhead .cnt.hot{color:var(--amber)}
  .foldhead .chev{color:var(--dim); font-size:17px; line-height:1; transition:transform .18s ease}
  .fold.open .chev{transform:rotate(90deg)}
  .foldbody{padding:0 11px 11px}
  .foldbody .item{background:var(--card-2); border-color:rgba(255,255,255,.05)}
  .fold .hb{font-size:12.5px; color:var(--amber); padding:8px 6px; flex:0 0 auto; white-space:nowrap; font-weight:600}

  /* ---------- items ---------- */
  .item{display:flex; align-items:center; gap:12px; background:linear-gradient(180deg, rgba(255,255,255,.022), transparent 55%), var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px; margin-bottom:10px; position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 6px 16px rgba(0,0,0,.16)}
  .item .box{width:26px; height:26px; border-radius:9px; border:1.7px solid var(--dim); flex:0 0 auto; display:flex; align-items:center; justify-content:center; transition:.15s; background:none}
  .item .box svg{width:14px; height:14px; opacity:0; transition:.15s}
  .item.done{opacity:.55}
  .item.done .box{background:linear-gradient(140deg, #6FD9B1, #45B98C); border-color:transparent; box-shadow:0 3px 12px rgba(90,199,158,.3); animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
  .item.habitem{border-left:3px solid var(--mint)}
  .item.habitem .box{border-radius:50%}
  .item.done .box svg{opacity:1}
  .item.done .txt{text-decoration:line-through; text-decoration-color:rgba(234,237,246,.4)}
  .item .txt{flex:1; min-width:0; font-size:15px; line-height:1.35; overflow-wrap:anywhere}
  .item .meta{display:flex; flex-wrap:wrap; gap:4px 9px; font-size:12.5px; color:var(--dim); margin-top:5px; align-items:center}
  .item .meta .late{color:var(--red)}
  .item .meta .tg{color:var(--blue)}
  .item .meta .pj{color:var(--violet)}
  .item .meta .gl{color:var(--amber)}
  .item.p1{border-left:3px solid var(--p1)} .item.p2{border-left:3px solid var(--p2)} .item.p3{border-left:3px solid var(--p3)}
  .item .star{color:var(--amber); font-size:14px; flex:0 0 auto}
  .item .more{color:var(--dim); font-size:18px; padding:4px 8px; flex:0 0 auto}
  .item.pinged{animation:ping .5s ease}
  .item .subs{display:block; font-size:12px; color:var(--dim); margin-top:3px}
  .item .subs b{color:var(--soft); font-weight:500}
  @keyframes ping{0%{transform:scale(1)} 35%{transform:scale(1.02)} 100%{transform:scale(1)}}
  .empty{border:1px dashed var(--line); border-radius:var(--r); padding:22px 18px; text-align:center; color:var(--dim); font-size:13.5px; line-height:1.5; background:var(--card); margin-bottom:12px}

  /* ---------- chips / segments / buttons ---------- */
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:10px}
  .chips.scroll{flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; margin-right:-16px; padding-right:16px}
  .chip{border:1px solid var(--line); background:var(--ink); color:var(--soft); border-radius:99px; padding:8px 13px; font-size:13.5px; white-space:nowrap; flex:0 0 auto}
  .chip[aria-pressed="true"]{background:var(--amber-soft); border-color:var(--amber-line); color:var(--amber); font-weight:600}
  .chip.sm{padding:5px 10px; font-size:12.5px}
  .seg{display:flex; background:var(--ink); border:1px solid var(--line); border-radius:12px; padding:3px; margin-bottom:15px}
  .seg button{flex:1; padding:8px 4px; border-radius:9px; font-size:13.5px; color:var(--dim); font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--card-2); color:var(--text)}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line); background:var(--card); color:var(--soft); border-radius:12px; padding:10px 14px; font-size:14px; font-weight:600}
  .btn.hot{background:linear-gradient(135deg, #F6C57F, #EE9D55); border-color:transparent; color:var(--on-amber); box-shadow:0 4px 16px rgba(240,178,107,.30), inset 0 1px 0 rgba(255,255,255,.35)}
  .btn.hot:active{transform:translateY(1px)}
  .btn.warm{background:var(--amber-soft); border-color:var(--amber-line); color:var(--amber)}
  .btn.danger{color:var(--red); border-color:rgba(232,140,140,.4)}
  .btn.wide{display:flex; width:100%; margin-bottom:10px; padding:13px}
  .btn.sm{padding:7px 11px; font-size:13px; border-radius:10px}
  .btn.ghost{background:none; border-color:transparent; color:var(--dim)}
  .btns{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
  .linky{color:var(--amber); font-weight:600; font-size:inherit}

  /* ---------- inputs ---------- */
  .in{width:100%; background:var(--ink-2); border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:10px; box-shadow:inset 0 2px 6px rgba(0,0,0,.25); transition:border-color .15s, box-shadow .15s}
  .in:focus{outline:none; border-color:var(--amber-line); box-shadow:inset 0 2px 6px rgba(0,0,0,.25), 0 0 0 3px rgba(240,178,107,.12)}
  .in:focus{outline:2px solid var(--amber); outline-offset:0}
  textarea.in{min-height:88px; line-height:1.45}
  .fl{display:block; margin-bottom:10px}
  .fl>span{display:block; font-size:12.5px; color:var(--dim); margin:0 2px 5px; font-weight:600}
  .fl .in{margin-bottom:0}
  .qa{display:flex; gap:8px; margin-bottom:12px}
  .qa .in{margin-bottom:0; flex:1; min-width:0}
  .qa .btn{flex:0 0 auto}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
  .nudgeme{animation:shake .45s ease}
  @keyframes shake{20%,60%{transform:translateX(-4px)} 40%,80%{transform:translateX(4px)}}

  /* ---------- rings / bars / stats ---------- */
  .ring{position:relative; flex:0 0 auto}
  .ring svg{transform:rotate(-90deg); display:block; filter:drop-shadow(0 0 6px rgba(240,178,107,.25))}
  .ring .rv{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700}
  .bar{display:block; height:6px; border-radius:99px; background:var(--card-2); overflow:hidden}
  .bar i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg, #EE9D55, #F6C57F); box-shadow:0 0 8px rgba(240,178,107,.35); transition:width .3s}
  .bar.m i{background:var(--mint)} .bar.b i{background:var(--blue)} .bar.v i{background:var(--violet)}
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px}
  .stats.three{grid-template-columns:1fr 1fr 1fr}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:12px 13px}
  .stat .lab{font-size:12px; color:var(--dim); margin-bottom:3px}
  .stat b{font-family:var(--display); font-weight:700; font-size:24px; line-height:1.1; display:block}
  .stat .sub{font-size:11.5px; color:var(--dim); margin-top:3px}
  .stat.hi b{color:var(--amber)}
  .heat{display:grid; grid-template-columns:repeat(14,1fr); gap:4px; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:12px}
  .heat.wk{grid-template-columns:repeat(7,1fr)}
  .hc{aspect-ratio:1; border-radius:4px; background:var(--card-2)}
  .hc.p{background:var(--amber-soft)} .hc.f{background:var(--amber)} .hc.t{outline:2px solid var(--soft); outline-offset:-1px}
  .hc.m{background:var(--mint)} .hc.ms{background:var(--mint-soft)}
  .hc.tap{cursor:pointer}
  .backrow{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:12px}
  .bday{display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 0 6px; border-radius:10px; border:1px solid var(--line); background:var(--card-2); color:var(--soft); cursor:pointer}
  .bday i{font-style:normal; font-size:10px; color:var(--dim); text-transform:uppercase}
  .bday b{font-size:14px; font-weight:700}
  .bday.on{background:var(--mint-soft); border-color:var(--mint)} .bday.on b{color:var(--mint)}
  .bday.dim{opacity:.5} .bday.t{outline:2px solid var(--soft); outline-offset:-1px}
  .chart{display:flex; align-items:flex-end; gap:5px; height:110px; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:12px 12px 8px}
  .chart .col{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; min-width:0}
  .chart .col i{display:block; width:100%; max-width:22px; border-radius:5px 5px 2px 2px; background:var(--card-2); border:1px solid var(--line)}
  .chart .col.hit i{background:var(--amber); border-color:var(--amber)}
  .chart .col.m i{background:var(--mint); border-color:var(--mint)}
  .chart .col.b i{background:var(--blue); border-color:var(--blue)}
  .chart .col span{font-size:10px; color:var(--dim); white-space:nowrap}
  .chart .col.today span{color:var(--amber)}
  .spark{width:100%; height:90px; display:block; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:6px}
  .spark .ln{fill:none; stroke:var(--amber); stroke-width:2}
  .spark .ar{fill:var(--amber-soft)}
  .spark .tl{stroke:var(--line-2); stroke-width:1; stroke-dasharray:4 4}
  .spark .ln.m{stroke:var(--mint)} .spark .ar.m{fill:var(--mint-soft)}
  .sparkfoot{display:flex; justify-content:space-between; font-size:11px; color:var(--dim); margin-top:5px; padding:0 2px}
  .moodrow{display:flex; gap:6px}
  .moodrow button{flex:1; aspect-ratio:1; border-radius:14px; background:var(--ink); border:1px solid var(--line); font-size:26px; display:flex; align-items:center; justify-content:center}
  .moodrow button[aria-pressed="true"]{background:var(--amber-soft); border-color:var(--amber)}
  .scale{display:flex; gap:5px}
  .scale button{flex:1; height:36px; border-radius:9px; background:var(--ink); border:1px solid var(--line); font-size:13px; color:var(--dim); font-weight:600}
  .scale button[aria-pressed="true"]{background:var(--amber); border-color:var(--amber); color:var(--on-amber)}

  /* ---------- dashboard ---------- */
  .hero-h{display:flex; align-items:center; gap:14px; margin-bottom:14px}
  .hero-h h1{font-size:33px; line-height:1.04; letter-spacing:-.02em}
  .hero-h h1 small{display:block; font-family:var(--body); font-weight:400; font-size:13.5px; color:var(--dim); margin-top:5px}
  .dq{font-family:var(--display); font-size:17px; line-height:1.4; font-weight:500; color:var(--soft)}
  .dq small{display:block; font-family:var(--body); font-size:12px; color:var(--dim); margin-top:7px}
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
  .tile{background:linear-gradient(180deg, rgba(255,255,255,.025), transparent 50%), var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; text-align:left; min-height:96px; display:flex; flex-direction:column; justify-content:space-between; box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 6px 16px rgba(0,0,0,.16)}
  .tile.a{background:linear-gradient(155deg, rgba(240,178,107,.14), rgba(240,178,107,.03) 60%), var(--card); border-color:rgba(240,178,107,.22)}
  .tile.m{background:linear-gradient(155deg, rgba(90,199,158,.14), rgba(90,199,158,.03) 60%), var(--card); border-color:rgba(90,199,158,.22)}
  .tile.b{background:linear-gradient(155deg, rgba(140,162,232,.14), rgba(140,162,232,.03) 60%), var(--card); border-color:rgba(140,162,232,.22)}
  .tile.v{background:linear-gradient(155deg, rgba(183,156,240,.14), rgba(183,156,240,.03) 60%), var(--card); border-color:rgba(183,156,240,.22)}
  .tile .tl{font-size:12.5px; color:var(--dim); font-weight:600}
  .tile b{font-family:var(--display); font-size:24px; font-weight:700; line-height:1; display:block; margin-top:8px}
  .tile .ts{font-size:12px; color:var(--dim); margin-top:4px}
  .tile.a b{color:var(--amber)} .tile.m b{color:var(--mint)} .tile.b b{color:var(--blue)} .tile.v b{color:var(--violet)}
  .habstrip{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-right:-16px; padding-right:16px}
  .hab{flex:0 0 auto; width:86px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 9px; text-align:center}
  .hab .hi{font-size:22px; line-height:1}
  .hab .ht{font-size:12px; color:var(--soft); margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hab .hs{font-size:11px; color:var(--dim); margin-top:2px}
  .hab.on{background:var(--mint-soft); border-color:var(--mint)}
  .hab.on .hs{color:var(--mint)}
  .upnext{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:14px; padding:13px 14px; margin-bottom:12px}
  .upnext b{display:block; font-size:15px; font-weight:600; margin-bottom:2px}
  .upnext span{font-size:12.5px; color:var(--dim)}
  .upnext .lab{font-size:12px; color:var(--amber); margin-bottom:2px; font-weight:600}
  .focusline{display:flex; align-items:center; gap:8px; background:var(--amber-soft); border:1px solid var(--amber-line); border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:14px}
  .focusline b{font-size:12px; color:var(--amber); font-weight:600; white-space:nowrap}

  /* ---------- goals ---------- */
  .gposter{position:relative; isolation:isolate; z-index:0; display:block; width:100%; text-align:left; border-radius:20px; overflow:hidden; background:var(--card); border:1px solid var(--line); height:clamp(220px,40vh,400px); margin-bottom:10px}
  .gposter:active{filter:brightness(1.07)}
  .gposter img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .gposter .gshade{position:absolute; inset:0; z-index:0; pointer-events:none; background:linear-gradient(180deg,rgba(18,21,31,.05) 30%,rgba(18,21,31,.55) 62%,rgba(18,21,31,.95) 100%)}
  .gposter .init{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:110px; color:var(--amber); opacity:.28}
  .gposter .low{position:absolute; z-index:1; left:16px; right:16px; bottom:15px}
  .gposter .low b{display:block; font-family:var(--display); font-weight:700; font-size:25px; line-height:1.15; margin-bottom:4px; color:#fff; text-shadow:0 1px 10px rgba(0,0,0,.45)}
  .gposter .low i{display:block; font-style:normal; font-size:13px; color:rgba(255,255,255,.88); margin-bottom:9px}
  .gposter .low .bar{background:rgba(255,255,255,.25)}
  .gposter .pctb,.gposter .areab{position:absolute; z-index:1; top:13px; font-family:var(--display); font-weight:700; font-size:14px; color:#fff; background:rgba(0,0,0,.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); padding:6px 12px; border-radius:99px}
  .gposter .pctb{right:13px} .gposter .areab{left:13px; font-family:var(--body); font-weight:600; font-size:12px}
  .gpanel{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px; margin:-2px 0 14px; animation:panelin .16s ease}
  @keyframes panelin{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
  .hero{position:relative; display:block; width:100%; border-radius:18px; overflow:hidden; margin-bottom:14px; background:var(--card); border:1px solid var(--line); height:clamp(260px,50vh,480px)}
  .hero .shotbg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(24px) brightness(.5); transform:scale(1.2)}
  .hero .pic{position:relative; width:100%; height:100%; object-fit:contain}
  .hero.fill .pic{object-fit:cover}
  .hero .cap{position:absolute; left:12px; bottom:10px; font-size:12.5px; color:#fff; background:rgba(0,0,0,.45); padding:4px 10px; border-radius:99px}
  .hero .dots{position:absolute; right:12px; bottom:12px; display:flex; gap:4px}
  .hero .dots i{width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.4)} .hero .dots i.on{background:#fff}
  .nohero{display:block; width:100%; border:1px dashed var(--line); border-radius:18px; background:var(--card); color:var(--dim); font-size:13.5px; line-height:1.55; padding:26px 20px; margin-bottom:14px; text-align:center}
  .ptitle{font-size:26px; margin:2px 2px 4px}
  .pwhy{font-size:14px; color:var(--soft); margin:0 2px 12px; line-height:1.5}
  .sbnum{font-family:var(--display); font-weight:700; font-size:34px; line-height:1.05; margin-bottom:8px}
  .sbnum span{font-size:16px; color:var(--soft); margin-left:6px; font-weight:500}
  .pics{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px}
  .pics button{flex:0 0 auto; width:74px; height:74px; border-radius:12px; overflow:hidden; background:var(--card); border:1px solid var(--line); color:var(--dim); font-size:12.5px}
  .pics img{width:100%; height:100%; object-fit:cover; display:block}
  .log{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:5px 13px}
  .logrow{display:flex; align-items:baseline; gap:9px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px}
  .logrow:last-child{border-bottom:none}
  .logrow em{font-style:normal; color:var(--mint)}
  .logrow em.n{color:var(--amber)} .logrow em.r{filter:none}
  .logrow .lm{flex:0 0 auto; color:var(--dim); font-size:16px; line-height:1; padding:0 3px}
  .pip{display:inline-block; width:8px; height:8px; border-radius:99px; margin-right:8px; vertical-align:1px}
  .pip.a{background:var(--amber)} .pip.m{background:var(--mint)} .pip.v{background:var(--violet)}
  .obdots{display:flex; gap:6px; margin-bottom:12px}
  .obdots i{width:22px; height:4px; border-radius:99px; background:var(--card-2)}
  .obdots i.on{background:var(--amber)}
  .btn.grow{flex:1}
  .kinddesc{font-size:12.5px; margin:-5px 2px 14px; color:var(--dim)}
  .kinddesc b{font-weight:700}
  .kinddesc.k-task b{color:var(--amber)} .kinddesc.k-habit b{color:var(--mint)} .kinddesc.k-goal b{color:var(--violet)}
  .kinddesc.k-note b{color:var(--blue)} .kinddesc.k-project b{color:var(--violet)}
  .dnote{display:flex; align-items:baseline; gap:8px}
  .dnote .grow2{flex:1} .dnote .nx{color:var(--dim); font-size:15px; padding:0 4px; flex:0 0 auto}
  .item.habitem .box{border-color:rgba(90,199,158,.55)}
  .logrow s{flex:1; text-decoration:none; color:var(--soft); overflow-wrap:anywhere}
  .logrow u{text-decoration:none; color:var(--dim); font-size:11.5px; white-space:nowrap}
  .dnote{font-size:13.5px; color:var(--text); font-style:italic; border-left:2px solid var(--amber); padding-left:10px; margin:10px 0 2px}
  .dtime{color:var(--dim); font-size:11.5px; font-style:normal}

  /* ---------- habits ---------- */
  .hrow{display:flex; align-items:center; gap:12px; background:linear-gradient(180deg, rgba(255,255,255,.022), transparent 55%), var(--card); border:1px solid var(--line); border-radius:16px; padding:15px 14px; margin-bottom:11px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 6px 16px rgba(0,0,0,.16); transition:border-color .2s}
  .hrow.done{border-color:rgba(90,199,158,.35); box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 6px 20px rgba(90,199,158,.10)}
  .hrow .hic{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; background:var(--card-2); flex:0 0 auto}
  .hrow .hm{flex:1; min-width:0}
  .hrow .hm b{display:block; font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hrow .hm span{font-size:12.5px; color:var(--dim)}
  .hrow .wk{display:flex; gap:4px; margin-top:9px}
  .hrow .wk i{width:13px; height:13px; border-radius:4px; background:var(--card-2)}
  .hrow .wk i.on{background:var(--mint)} .hrow .wk i.off{opacity:.3} .hrow .wk i.t{outline:1.5px solid var(--soft); outline-offset:-1px}
  .hrow .hbtn{width:42px; height:42px; border-radius:50%; border:1.7px solid rgba(90,199,158,.55); display:flex; align-items:center; justify-content:center; flex:0 0 auto}
  .hrow .hbtn svg{width:16px; height:16px; opacity:0}
  .hrow.done .hbtn{background:linear-gradient(140deg, #6FD9B1, #45B98C); border-color:transparent; box-shadow:0 4px 16px rgba(90,199,158,.35), inset 0 1px 0 rgba(255,255,255,.3); animation:pop .3s cubic-bezier(.3,1.6,.5,1)} .hrow.done .hbtn svg{opacity:1}
  @keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
  .hrow.done{border-color:rgba(90,199,158,.35)}
  .emojirow{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
  .emojirow button{width:44px; height:44px; border-radius:12px; background:var(--ink); border:1px solid var(--line); font-size:22px}
  .emojirow button[aria-pressed="true"]{background:var(--amber-soft); border-color:var(--amber)}
  .dayset{display:flex; gap:5px; margin-bottom:10px}
  .dayset button{flex:1; height:38px; border-radius:10px; background:var(--ink); border:1px solid var(--line); font-size:12.5px; color:var(--dim); font-weight:600}
  .dayset button[aria-pressed="true"]{background:var(--mint-soft); border-color:var(--mint); color:var(--mint)}

  /* ---------- calendar ---------- */
  .calhead{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .calhead h2{flex:1; text-align:center; font-size:18px}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:12px}
  .cal .dow{font-size:11px; color:var(--dim); text-align:center; padding:4px 0; font-weight:600}
  .cal .d{aspect-ratio:1; border-radius:11px; background:var(--card); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:13.5px; color:var(--soft); position:relative}
  .cal .d.out{opacity:.3} .cal .d.t{border-color:var(--amber); color:var(--amber); font-weight:700}
  .cal .d[aria-selected="true"]{background:var(--amber-soft); border-color:var(--amber-line)}
  .cal .d .dots{display:flex; gap:2px; height:5px}
  .cal .d .dots i{width:5px; height:5px; border-radius:50%; background:var(--amber)} .cal .d .dots i.m{background:var(--mint)} .cal .d .dots i.b{background:var(--blue)}
  .cal .d.past.hit{background:var(--mint-soft)}
  .weekstrip{display:flex; gap:6px; margin-bottom:12px}
  .weekstrip button{flex:1; border-radius:12px; background:var(--card); border:1px solid var(--line); padding:8px 2px; text-align:center}
  .weekstrip .dn{display:block; font-size:11px; color:var(--dim)} .weekstrip .dd{display:block; font-size:16px; font-weight:700; font-family:var(--display); margin-top:2px}
  .weekstrip .dl{display:block; font-size:10px; color:var(--dim); margin-top:2px}
  .weekstrip button[aria-selected="true"]{background:var(--amber-soft); border-color:var(--amber-line)} .weekstrip button[aria-selected="true"] .dd{color:var(--amber)}
  .weekstrip button.t .dd{color:var(--amber)}

  /* ---------- journal ---------- */
  .jcard{background:linear-gradient(165deg,var(--card-2),var(--card)); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
  .jcard .jd{font-size:12.5px; color:var(--amber); font-weight:600; margin-bottom:4px}
  .jcard .jm{font-size:22px; float:right}
  .jcard p{margin:0; font-size:14px; color:var(--soft); line-height:1.5}
  .jcard .jg{font-size:13px; color:var(--dim); margin-top:6px}
  .prompt{font-family:var(--display); font-size:17px; font-weight:500; line-height:1.4; color:var(--text); margin:0 0 10px}

  /* ---------- timer ---------- */
  .timer{background:linear-gradient(165deg,var(--card-2),var(--card)); border:1px solid var(--line); border-radius:var(--r-l); padding:22px 16px; text-align:center; margin-bottom:12px}
  .clock{font-family:var(--display); font-weight:800; font-size:64px; line-height:1; letter-spacing:-.02em; margin-bottom:6px}
  .tlab{font-size:13.5px; color:var(--dim); margin-bottom:14px}
  .tbtns{display:flex; gap:8px; justify-content:center}
  .tbtn{border:1px solid var(--line); background:var(--card); color:var(--soft); border-radius:12px; padding:11px 22px; font-size:15px; font-weight:600}
  .tbtn.hot{background:var(--amber); border-color:var(--amber); color:var(--on-amber)}
  .timer.on{border-color:var(--amber-line)}
  .tring{width:200px; height:200px; margin:0 auto 10px}

  /* ---------- notes ---------- */
  .note{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; text-align:left; width:100%; display:block}
  .note b{display:block; font-size:15px; margin-bottom:3px}
  .note p{margin:0; font-size:13px; color:var(--dim); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .note .nm{font-size:11.5px; color:var(--mute); margin-top:6px}
  .note.pin{border-color:var(--amber-line)}
  .tags{display:inline-flex; gap:5px; flex-wrap:wrap}
  .tag{font-size:11px; color:var(--blue); background:var(--blue-soft); padding:2px 8px; border-radius:99px}

  /* ---------- badges ---------- */
  .badges{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px}
  .badge{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 8px; text-align:center}
  .badge .bi{font-size:30px; line-height:1; filter:grayscale(1); opacity:.35}
  .badge b{display:block; font-size:12.5px; margin-top:7px; color:var(--dim)}
  .badge span{display:block; font-size:10.5px; color:var(--mute); margin-top:2px; line-height:1.3}
  .badge.won{border-color:var(--amber-line); background:var(--amber-soft)}
  .badge.won .bi{filter:none; opacity:1} .badge.won b{color:var(--text)}

  /* ---------- more menu grid ---------- */
  .mgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:6px 0 10px}
  .mgrid button{background:var(--ink); border:1px solid var(--line); border-radius:14px; padding:14px 6px; text-align:center}
  .mgrid .mi{font-size:24px; line-height:1}
  .mgrid b{display:block; font-size:12.5px; margin-top:7px; font-weight:600}

  /* ---------- pages / sheets / overlays ---------- */
  .page{position:relative; z-index:1; background:var(--ink); min-height:100dvh; padding-bottom:calc(30px + var(--sab))}
  .pbar{position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:8px; background:rgba(18,21,31,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding:calc(10px + var(--sat)) 14px 10px; border-bottom:1px solid var(--line)}
  .pbar .back{font-size:16.5px; color:var(--amber); font-weight:600; padding:10px 14px 10px 6px; margin:-8px 0}
  .pbar .sp{flex:1}
  .pwrap{max-width:640px; margin:0 auto; padding:16px 16px 60px}
  .scrim{position:fixed; inset:0; z-index:60; background:rgba(5,7,12,.66); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:flex-end; justify-content:center; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
  .sheet{width:100%; max-width:640px; margin-top:auto; max-height:none; overflow:visible; background:var(--card); border:1px solid var(--line); border-radius:22px 22px 0 0; padding:18px 18px calc(18px + var(--sab)); animation:up .2s ease}
  .sheet h2{font-size:20px; margin-bottom:8px}
  .sheet .when{font-size:12.5px; color:var(--amber); font-weight:600; margin-bottom:6px}
  .sheet p{font-size:14px; line-height:1.5; color:var(--soft)}
  .sheetbtns{display:flex; gap:8px; margin-top:12px}
  .sheetbtns .ghost{flex:1; border:1px solid var(--line); border-radius:12px; padding:12px; color:var(--soft); font-weight:600}
  .sheetbtns .solid{flex:1.4; background:var(--amber); color:var(--on-amber); border-radius:12px; padding:12px; font-weight:700}
  .sheetbtns .danger{flex:1; border:1px solid rgba(232,140,140,.4); color:var(--red); border-radius:12px; padding:12px; font-weight:600}
  .grab{width:38px; height:4px; border-radius:99px; background:var(--line-2); margin:-6px auto 12px}
  @keyframes up{from{transform:translateY(24px); opacity:0} to{transform:none; opacity:1}}
  .menu .mrow{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:13px 6px; border-bottom:1px solid var(--line); font-size:15px}
  .menu .mrow:last-child{border-bottom:none}
  .menu .mrow .mi{width:26px; text-align:center; color:var(--dim)}
  .menu .mrow.red{color:var(--red)}
  .vstage{position:relative; width:100%; height:min(66vh,560px); display:flex; align-items:center; justify-content:center;
    background:var(--ink-2); border:1px solid var(--line); border-radius:18px; overflow:hidden; margin-bottom:14px}
  .vstage img{max-width:100%; max-height:100%; object-fit:contain; border-radius:14px}
  .vtap{position:absolute; top:0; bottom:0; width:34%; z-index:2} .vtap.l{left:0} .vtap.r{right:0}
  .vnav{position:absolute; z-index:3; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%;
    background:rgba(0,0,0,.5); color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center}
  .vnav.l{left:10px} .vnav.r{right:10px}
  .vmeta{max-width:640px; margin:0 auto; width:100%}
  .vmeta h3{font-size:18px; margin-bottom:4px} .vmeta p{font-size:13.5px; color:var(--soft); margin:0 0 8px}
  .toast{position:fixed; left:50%; bottom:calc(104px + var(--sab)); transform:translateX(-50%); background:rgba(30,36,54,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.09); color:var(--text); padding:10px 16px; border-radius:12px; font-size:14px; z-index:80; max-width:90vw; box-shadow:0 8px 30px rgba(0,0,0,.4); animation:up .2s ease; display:flex; align-items:center; gap:12px}
  .toast button{color:var(--amber); font-weight:700}
  .party{position:fixed; inset:0; z-index:75; pointer-events:none; overflow:hidden}
  .party i{position:absolute; top:-20px; width:9px; height:14px; border-radius:2px; animation:pfall linear forwards}
  @keyframes pfall{0%{transform:translateY(-8vh) rotate(0); opacity:1} 85%{opacity:1} 100%{transform:translateY(112vh) rotate(560deg); opacity:0}}

  /* ---------- nav + fab ---------- */
  .navwrap{position:fixed; left:0; right:0; bottom:0; z-index:30; pointer-events:none; padding:0 14px calc(10px + var(--sab))}
  .nav{pointer-events:auto; max-width:640px; margin:0 auto; display:flex; background:rgba(16,20,32,.82); backdrop-filter:blur(22px) saturate(1.3); -webkit-backdrop-filter:blur(22px) saturate(1.3); border:1px solid rgba(255,255,255,.07); border-radius:24px; padding:7px; box-shadow:0 16px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05)}
  .nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 2px; border-radius:14px; font-size:10.5px; color:var(--dim); font-weight:600}
  .nav button svg{width:22px; height:22px}
  .nav button{transition:color .15s}
  .nav button[aria-selected="true"]{background:linear-gradient(180deg, rgba(240,178,107,.22), rgba(240,178,107,.10)); color:var(--amber); box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 4px 14px rgba(240,178,107,.12)}
  .fab{position:fixed; right:16px; bottom:calc(94px + var(--sab)); z-index:31; width:58px; height:58px; border-radius:50%; background:linear-gradient(140deg, #F6C57F, #ED954B); color:var(--on-amber); font-size:30px; line-height:1;
    box-shadow:0 12px 34px rgba(240,178,107,.42), inset 0 1.5px 0 rgba(255,255,255,.4); display:flex; align-items:center; justify-content:center; font-weight:400; transition:transform .15s}
  .fab:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div><div class="wordmark">Momentum<span>.</span></div><div class="topdate" id="datestr"></div></div>
    <div class="grow"></div>

  </div>
  <div id="view"></div>
</div>
<div class="navwrap"><div class="nav" role="tablist">
  <button role="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg>Home</button>
  <button role="tab" data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Tasks</button>

  <button role="tab" data-tab="habits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 3 6.2"/><path d="M4 18v-5h5"/></svg>Habits</button>
  <button role="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>More</button>
</div></div>
<button class="fab" id="fab" aria-label="Add">+</button>

<script>
(function(){
"use strict";

/* ================= storage & migration ================= */
var KEY = "momentum:v1", BUILD = "v36";
var state = {
  v:2, name:"", accent:"amber", mode:"night", onboarded:false,
  tasks:[], habits:[], goals:[], projects:[], areas:["Health","Work","Money","Learning","Home","People"],
  history:{}, oneThing:{}, journal:{}, inbox:[], notes:[], reviews:{}, focus:[], badges:{}, templates:[],
  lastActive:null, briefSeen:{}, totalDone:0, bestStreak:0, pomos:{}, nudges:false, dayStart:4,
  dash:["focus","tiles","upnext","habits","goals","journal","inbox","quote"]
};
var saveTimer = null;
function localGet(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
function localSet(v){ try{ localStorage.setItem(KEY, v); }catch(e){} }
function load(){
  var raw = localGet();
  if(raw){ try{ Object.assign(state, JSON.parse(raw)); }catch(e){} }
  migrate();
}
function migrate(){
  ["tasks","habits","goals","projects","inbox","notes","focus","templates"].forEach(function(k){ if(!Array.isArray(state[k])) state[k] = []; });
  ["history","oneThing","journal","reviews","badges","pomos","briefSeen"].forEach(function(k){ if(!state[k] || typeof state[k] !== "object") state[k] = {}; });
  if(!Array.isArray(state.areas) || !state.areas.length) state.areas = ["Health","Work","Money","Learning","Home","People"];
  if(!Array.isArray(state.dash) || !state.dash.length) state.dash = ["focus","tiles","upnext","habits","goals","journal","inbox","quote"];
  state.tasks.forEach(function(t){ t.tags = t.tags || []; t.subs = t.subs || []; t.pri = t.pri || 0; t.notes = t.notes || ""; t.projectId = t.projectId || ""; t.goalId = t.goalId || ""; });
  state.habits.forEach(function(x){ x.log = x.log || {}; x.icon = x.icon || "✦"; if(x.days && !x.days.length) x.days = null; });
  state.goals.forEach(function(g){ g.miles = g.miles || []; g.notes = g.notes || []; g.shots = g.shots || []; g.log = g.log || []; g.area = g.area || ""; });
  if(state.name) state.onboarded = true;
  // legacy pomos -> focus sessions (once)
  if(state.pomos && Object.keys(state.pomos).length && !state.focus.length){
    Object.keys(state.pomos).forEach(function(d){ for(var i=0;i<state.pomos[d];i++) state.focus.push({d:d, len:25, taskId:"", at:0}); });
  }
  state.v = 2;
}
function save(){
  var payload = JSON.stringify(state);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ localSet(payload); }, 250);
}

/* ================= dates & helpers ================= */
function fmtKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayKey(){ var x = new Date(); x.setHours(x.getHours() - (state.dayStart||4)); return fmtKey(x); }
function shiftKey(base, n){ var d = new Date(base+"T12:00:00"); d.setDate(d.getDate()+n); return fmtKey(d); }
function daysBetween(a,b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/86400000); }
function dow(k){ return new Date(k+"T12:00:00").getDay(); }
function weekKey(k){ var d = new Date(k+"T12:00:00"); var day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); return fmtKey(d); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function nfmt(n){ n = +n || 0; return Math.abs(n) >= 1000 ? n.toLocaleString() : (Math.round(n*100)/100).toString(); }
function pick(arr, seed){ var h = 0; for(var i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) & 0xffff; return arr[h % arr.length]; }
function dayTitle(k){
  var T = TODAY;
  if(k === T) return "Today";
  if(k === shiftKey(T,1)) return "Tomorrow";
  if(k === shiftKey(T,-1)) return "Yesterday";
  var d = new Date(k+"T12:00:00"), n = daysBetween(T, k);
  if(n > 1 && n < 7) return d.toLocaleDateString(undefined,{weekday:"long"});
  return d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
}
function longDate(k){ return new Date(k+"T12:00:00").toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"}); }
function timeStr(ts){ return new Date(ts).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
var TODAY = todayKey();
var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#12151F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function by(f){ return function(a,b){ var x=f(a), y=f(b); return x<y?-1:x>y?1:0; }; }
function byId(arr, id){ for(var i=0;i<arr.length;i++) if(arr[i].id === id) return arr[i]; return null; }

/* ================= theme ================= */
var THEMES = {
  amber:["#F0B26B","rgba(240,178,107,.14)","rgba(240,178,107,.32)","#1A1408"],
  mint:["#63CFA4","rgba(99,207,164,.14)","rgba(99,207,164,.32)","#07201A"],
  sky:["#8BB8F0","rgba(139,184,240,.14)","rgba(139,184,240,.32)","#0A1628"],
  rose:["#EF93AE","rgba(239,147,174,.16)","rgba(239,147,174,.34)","#24101A"],
  violet:["#B79CF0","rgba(183,156,240,.16)","rgba(183,156,240,.34)","#170F2A"],
  lime:["#C6E06B","rgba(198,224,107,.16)","rgba(198,224,107,.34)","#171C08"]
};
function applyTheme(){
  var t = THEMES[state.accent] || THEMES.amber, r = document.documentElement;
  r.style.setProperty("--amber", t[0]); r.style.setProperty("--amber-soft", t[1]); r.style.setProperty("--amber-line", t[2]); r.style.setProperty("--on-amber", t[3]);
  r.setAttribute("data-mode", state.mode || "night");
}

/* ================= domain: tasks ================= */
function openTasks(){ return state.tasks.filter(function(t){ return !t.done; }); }
function tasksOn(k){ return state.tasks.filter(function(t){ return !t.done && t.date === k; }); }
function lateTasks(){ return openTasks().filter(function(t){ return t.date && t.date < TODAY; }); }
function doneToday(){ return state.tasks.filter(function(t){ return t.done && t.doneDay === TODAY; }).sort(by(function(t){ return -(t.doneAt||0); })); }
function taskSort(a,b){
  if(!!a.star !== !!b.star) return a.star ? -1 : 1;
  if((a.pri||0) !== (b.pri||0)) return (a.pri||9) - (b.pri||9) ;
  if((a.time||"") !== (b.time||"")) return (a.time||"99") < (b.time||"99") ? -1 : 1;
  return 0;
}
function priSort(a,b){ var pa = a.pri||4, pb = b.pri||4; if(pa!==pb) return pa-pb; return taskSort(a,b); }
function goalName(id){ var g = byId(state.goals, id); return g ? g.title : ""; }
function projName(id){ var p = byId(state.projects, id); return p ? p.name : ""; }
function taskMetaBits(t, extra){
  var bits = [];
  if(extra) bits.push('<span class="late">' + extra + '</span>');
  if(t.time) bits.push(t.time);
  if(t.est) bits.push(t.est + "m");
  if(t.goalId && goalName(t.goalId)) bits.push('<span class="gl">◎ ' + esc(goalName(t.goalId)) + '</span>');
  if(t.projectId && projName(t.projectId)) bits.push('<span class="pj">▣ ' + esc(projName(t.projectId)) + '</span>');
  (t.tags||[]).forEach(function(x){ bits.push('<span class="tg">#' + esc(x) + '</span>'); });
  if(t.subs && t.subs.length){ var sd = t.subs.filter(function(s){ return s.done; }).length; bits.push('<span>☰ ' + sd + '/' + t.subs.length + '</span>'); }
  return bits.join(" · ");
}
function itemHTML(o){
  var t = o.t;
  return '<div class="item' + (t.done?" done":"") + (t.pri?" p"+t.pri:"") + (justDone===t.id?" pinged":"") + '">' +
    '<button class="box" data-toggle="' + t.id + '" data-kind="task" aria-label="Mark done">' + CHECK + '</button>' +
    '<div class="txt" data-open="' + t.id + '" style="cursor:pointer">' + esc(t.title) +
      (o.meta !== "" ? '<span class="meta">' + (o.meta || taskMetaBits(t, o.extra)) + '</span>' : '') + '</div>' +
    (t.star ? '<span class="star">★</span>' : '') +
    '<button class="more" data-more="' + t.id + '" data-kind="task" aria-label="More">⋯</button>' +
  '</div>';
}
function habitItemHTML(x){
  var done = !!(x.log && x.log[TODAY]), run = habitRun(x);
  return '<div class="item habitem' + (done?" done":"") + '">' +
    '<button class="box" data-toggle="' + x.id + '" data-kind="habit" aria-label="Mark done">' + CHECK + '</button>' +
    '<div class="txt" data-hopen="' + x.id + '" style="cursor:pointer">' + esc(x.icon||"✦") + ' ' + esc(x.title) +
      '<span class="meta">' + (habitDaysLabel(x) || "every day") + (run > 1 ? ' · ' + run + ' in a row' : '') + (x.goalId && goalName(x.goalId) ? ' · <span class="gl">◎ ' + esc(goalName(x.goalId)) + '</span>' : '') + '</span></div>' +
    '<button class="more" data-more="' + x.id + '" data-kind="habit" aria-label="More">⋯</button>' +
  '</div>';
}
var justDone = null;
function cheer(){ return pick(["Logged.","That's one.","Down it goes.","Counted.","Good.","Chalk it up.","Cleared.","Nice."], String(Date.now())); }
function toggle(id, kind){
  if(kind === "habit"){
    var x = byId(state.habits, id); if(!x) return;
    x.log = x.log || {}; x.logAt = x.logAt || {};
    if(x.log[TODAY]){ delete x.log[TODAY]; delete x.logAt[TODAY]; }
    else { x.log[TODAY] = 1; x.logAt[TODAY] = Date.now(); justDone = id; toast(cheer()); }
  } else {
    var t = byId(state.tasks, id); if(!t) return;
    if(t.done){ t.done = false; delete t.doneDay; delete t.doneAt; state.totalDone = Math.max(0, (state.totalDone||0) - 1); }
    else { t.done = true; t.doneDay = TODAY; t.doneAt = Date.now(); state.totalDone = (state.totalDone||0) + 1; justDone = id; toast(cheer()); }
  }
  checkBadges(); save(); render();
  setTimeout(function(){ justDone = null; }, 600);
}

/* ================= domain: habits ================= */
function habitFlip(id, k){
  var x = byId(state.habits, id); if(!x || !k) return;
  if(k > TODAY){ toast("Can't log the future — yet."); return; }
  x.log = x.log || {}; x.logAt = x.logAt || {};
  if(x.log[k]){ delete x.log[k]; delete x.logAt[k]; toast("Unmarked " + dayTitle(k) + "."); }
  else {
    x.log[k] = 1; x.logAt[k] = Date.now();
    if(x.createdDay && k < x.createdDay) x.createdDay = k;
    toast(k === TODAY ? cheer() : "Logged for " + dayTitle(k) + ".");
  }
  checkBadges(); save(); render();
}
function habitDueOn(x, k){ if(!x.days || !x.days.length) return true; return x.days.indexOf(dow(k)) > -1; }
function habitsDueToday(){ return state.habits.filter(function(x){ return !x.archived && habitDueOn(x, TODAY) && !(x.createdDay && x.createdDay > TODAY); }); }
function habitDaysLabel(x){
  if(!x.days || !x.days.length || x.days.length === 7) return "";
  var n = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  if(x.days.length === 5 && x.days.indexOf(0)<0 && x.days.indexOf(6)<0) return "weekdays";
  if(x.days.length === 2 && x.days.indexOf(0)>-1 && x.days.indexOf(6)>-1) return "weekends";
  return x.days.slice().sort().map(function(d){ return n[d]; }).join(" ");
}
function habitRun(x){
  var run = 0, k = TODAY;
  if(!(x.log && x.log[TODAY])) k = shiftKey(k, -1);
  for(var i=0;i<400;i++){
    if(x.createdDay && k < x.createdDay) break;
    if(habitDueOn(x, k)){ if(x.log && x.log[k]) run++; else break; }
    k = shiftKey(k, -1);
  }
  return run;
}
function habitBest(x){
  var keys = Object.keys(x.log||{}).sort(), best = 0, run = 0, prev = null;
  keys.forEach(function(k){
    if(prev){
      var kk = shiftKey(prev, 1), gap = false;
      while(kk < k){ if(habitDueOn(x, kk)){ gap = true; break; } kk = shiftKey(kk, 1); }
      run = gap ? 1 : run + 1;
    } else run = 1;
    best = Math.max(best, run); prev = k;
  });
  return best;
}
function habitRate(x, n){
  var due = 0, hit = 0, k = TODAY;
  for(var i=0;i<n;i++){ if(!(x.createdDay && k < x.createdDay) && habitDueOn(x,k)){ due++; if(x.log && x.log[k]) hit++; } k = shiftKey(k,-1); }
  return due ? Math.round(hit/due*100) : 0;
}

/* ================= domain: goals ================= */
var SHOTS = {}, shotDB = null;
function visionOpen(){
  return new Promise(function(res){
    if(shotDB){ res(shotDB); return; }
    var rq;
    try{ rq = indexedDB.open("momentum-vision", 1); }catch(e){ res(null); return; }
    rq.onupgradeneeded = function(){ try{ rq.result.createObjectStore("shots", { keyPath:"id" }); }catch(e){} };
    rq.onsuccess = function(){ shotDB = rq.result; res(shotDB); };
    rq.onerror = function(){ res(null); };
  });
}
function shotsLoad(){
  return visionOpen().then(function(db){
    if(!db) return;
    return new Promise(function(res){
      var rq; try{ rq = db.transaction("shots","readonly").objectStore("shots").getAll(); }catch(e){ res(); return; }
      rq.onsuccess = function(){ (rq.result||[]).forEach(function(r){ SHOTS[r.id] = r; }); res(); };
      rq.onerror = function(){ res(); };
    });
  }).catch(function(){});
}
function shotPut(rec){ SHOTS[rec.id] = rec; return visionOpen().then(function(db){ if(!db) return; try{ db.transaction("shots","readwrite").objectStore("shots").put(rec); }catch(e){} }); }
function shotDrop(id){ delete SHOTS[id]; return visionOpen().then(function(db){ if(!db) return; try{ db.transaction("shots","readwrite").objectStore("shots").delete(id); }catch(e){} }); }
function shrinkImage(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(); };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ rej(); };
      im.onload = function(){
        var w = im.naturalWidth||im.width, h = im.naturalHeight||im.height; if(!w||!h){ rej(); return; }
        var max = 1400, s = Math.min(1, max/Math.max(w,h)), c = document.createElement("canvas");
        c.width = Math.round(w*s); c.height = Math.round(h*s);
        try{ c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .82)); }catch(e){ rej(); }
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function goalShots(g){ return (g.shots||[]).filter(function(id){ return SHOTS[id]; }); }
function anyShots(){ return state.goals.some(function(g){ return goalShots(g).length; }); }
function addShot(goalId){
  var g = byId(state.goals, goalId); if(!g) return;
  var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.style.cssText = "position:fixed;left:-9999px";
  inp.onchange = function(){
    var f = inp.files && inp.files[0]; if(!f){ inp.remove(); return; }
    toast("Saving picture…");
    shrinkImage(f).then(function(src){
      var rec = { id: uid(), src: src, t: Date.now(), day: TODAY, cap: "" };
      return shotPut(rec).then(function(){ g.shots = g.shots||[]; g.shots.unshift(rec.id); save(); render(); toast("Pinned to your vision."); });
    }).catch(function(){ toast("Couldn't read that picture."); }).then(function(){ inp.remove(); });
  };
  document.body.appendChild(inp); inp.click();
}
function goalDown(g){ return !!g.down; }
function goalBase(g){ var l = g.log||[]; return l.length ? +l[0].v : null; }
function goalPct(g){
  if(g.target > 0){
    var cur = +g.cur||0;
    if(goalDown(g)){ var b = goalBase(g); if(b===null) b = cur; if(b <= g.target) return 100; return clamp(Math.round((b-cur)/(b-g.target)*100),0,100); }
    return clamp(Math.round(cur/g.target*100),0,100);
  }
  var mi = g.miles||[];
  if(mi.length) return Math.round(mi.filter(function(m){ return m.done; }).length / mi.length * 100);
  var all = state.tasks.filter(function(t){ return t.goalId === g.id; });
  var done = all.filter(function(t){ return t.done; }).length;
  return all.length ? Math.round(done/all.length*100) : 0;
}
function goalNote(g){
  if(g.target > 0) return nfmt(g.cur||0) + (goalDown(g) ? " → " : " of ") + nfmt(g.target) + (g.unit ? " " + esc(g.unit) : "") + " · " + goalPct(g) + "%";
  var mi = g.miles||[];
  if(mi.length) return mi.filter(function(m){ return m.done; }).length + " of " + mi.length + " milestones";
  var all = state.tasks.filter(function(t){ return t.goalId === g.id; });
  if(!all.length) return "no plan attached yet";
  return all.filter(function(t){ return t.done; }).length + " of " + all.length + " tasks";
}
function dueLabel(g){
  if(!g.due) return "";
  var n = daysBetween(TODAY, g.due);
  if(n < 0) return " · " + Math.abs(n) + "d past due";
  if(n === 0) return " · due today";
  if(n < 60) return " · " + n + "d left";
  return " · " + Math.round(n/30) + "mo left";
}
function goalStats(g){
  var all = state.tasks.filter(function(t){ return t.goalId === g.id; });
  var done = all.filter(function(t){ return t.done; }), open = all.filter(function(t){ return !t.done; });
  var habits = state.habits.filter(function(x){ return x.goalId === g.id; });
  var days = {}; done.forEach(function(t){ if(t.doneDay) days[t.doneDay] = 1; });
  habits.forEach(function(x){ Object.keys(x.log||{}).forEach(function(k){ days[k] = 1; }); });
  (g.log||[]).forEach(function(l){ days[l.d] = 1; });
  var wk = shiftKey(TODAY,-6), last7 = done.filter(function(t){ return t.doneDay >= wk; }).length;
  habits.forEach(function(x){ Object.keys(x.log||{}).forEach(function(k){ if(k >= wk) last7++; }); });
  return { all:all, done:done, open:open, habits:habits, activeDays:Object.keys(days).length, last7:last7, since: g.createdDay ? daysBetween(g.createdDay, TODAY) : null };
}
function nextStep(g){ var o = state.tasks.filter(function(t){ return t.goalId === g.id && !t.done; }).sort(by(function(t){ return t.date||"9999"; })); return o[0] || null; }

/* ================= domain: days / streaks ================= */
function todayStats(){
  var habits = habitsDueToday(), hd = habits.filter(function(x){ return x.log && x.log[TODAY]; }).length;
  var tasks = state.tasks.filter(function(t){ return (t.date === TODAY && !t.done) || (t.done && t.doneDay === TODAY); });
  var td = tasks.filter(function(t){ return t.done; }).length;
  var total = habits.length + tasks.length, done = hd + td;
  return { total:total, done:done, rate: total ? done/total : 0, habits:habits.length, hd:hd, tasks:tasks.length, td:td };
}
function qualifies(s){ return s && s.total > 0 && s.done > 0 && s.rate >= 0.6; }
function dayStatsFor(k){ if(k === TODAY) return todayStats(); return state.history[k] || null; }
function streakCount(){
  var n = 0, k = TODAY;
  if(!qualifies(todayStats())) k = shiftKey(k,-1);
  for(var i=0;i<1000;i++){ if(qualifies(state.history[k] || (k===TODAY?todayStats():null))) n++; else break; k = shiftKey(k,-1); }
  return n;
}
function dayLoad(k){ var n = 0; state.habits.forEach(function(x){ if(!x.archived && !(x.createdDay && x.createdDay > k) && habitDueOn(x,k)) n++; }); n += tasksOn(k).length; return n; }
function upNextPick(){
  var s = todayStats();
  var late = lateTasks().sort(priSort); if(late.length) return { t:late[0], extra: daysBetween(late[0].date, TODAY) + "d late" };
  var now = tasksOn(TODAY).sort(priSort); if(now.length) return { t:now[0], extra:"" };
  return null;
}
function focusMinutes(k){ return state.focus.filter(function(f){ return f.d === k; }).reduce(function(a,f){ return a + (f.len||0); }, 0); }

/* ================= badges ================= */
var BADGES = [
  { id:"first", icon:"🌱", name:"First step", desc:"Clear your first item", test:function(){ return (state.totalDone||0) >= 1; } },
  { id:"ten", icon:"🔟", name:"Ten down", desc:"Clear 10 items", test:function(){ return (state.totalDone||0) >= 10; } },
  { id:"hundred", icon:"💯", name:"Century", desc:"Clear 100 items", test:function(){ return (state.totalDone||0) >= 100; } },
  { id:"streak3", icon:"🔥", name:"Warming up", desc:"3-day streak", test:function(){ return Math.max(streakCount(), state.bestStreak||0) >= 3; } },
  { id:"streak7", icon:"⚡", name:"One week", desc:"7-day streak", test:function(){ return Math.max(streakCount(), state.bestStreak||0) >= 7; } },
  { id:"streak30", icon:"🏔️", name:"Mountain", desc:"30-day streak", test:function(){ return Math.max(streakCount(), state.bestStreak||0) >= 30; } },
  { id:"goal1", icon:"🎯", name:"Aimed", desc:"Set a goal", test:function(){ return state.goals.length >= 1; } },

function syncChrome(){

function sparkHTML(points, opts){
  opts = opts || {};
  if(points.length < 2) return "";
  var W = 300, H = 78, pad = 6, vals = points.map(function(p){ return p.v; });
  var lo = Math.min.apply(null, vals.concat(opts.min != null ? [opts.min] : [])), hi = Math.max.apply(null, vals.concat(opts.max != null ? [opts.max] : []));
  if(hi === lo) hi = lo + 1;
  var xs = points.map(function(p,i){ return pad + i*(W-2*pad)/(points.length-1); });
  var ys = vals.map(function(v){ return H - pad - (v-lo)/(hi-lo)*(H-2*pad); });
  var d = xs.map(function(x,i){ return (i?"L":"M") + x.toFixed(1) + " " + ys[i].toFixed(1); }).join(" ");
  var area = d + " L" + xs[xs.length-1].toFixed(1) + " " + (H-pad) + " L" + xs[0].toFixed(1) + " " + (H-pad) + " Z";
  var tl = opts.target != null ? '<line class="tl" x1="0" x2="' + W + '" y1="' + (H-pad-(opts.target-lo)/(hi-lo)*(H-2*pad)).toFixed(1) + '" y2="' + (H-pad-(opts.target-lo)/(hi-lo)*(H-2*pad)).toFixed(1) + '"/>' : "";
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><path class="ar' + (opts.cls?" "+opts.cls:"") + '" d="' + area + '"/>' + tl + '<path class="ln' + (opts.cls?" "+opts.cls:"") + '" d="' + d + '"/></svg>';
}

function parseQuick(v){

  o.title = o.title.replace(/!([123])/g, function(m,g){ o.pri = +g; return ""; });
  if(/(^|\s)!!(\s|$)/.test(o.title)){ o.star = true; o.title = o.title.replace(/!!/g,""); }
  if(/\btomorrow\b/i.test(o.title)){ o.date = shiftKey(TODAY,1); o.title = o.title.replace(/\btomorrow\b/i,""); }
  else if(/\btoday\b/i.test(o.title)){ o.title = o.title.replace(/\btoday\b/i,""); }
  var wd = o.title.match(/\bnext (mon|tue|wed|thu|fri|sat|sun)\w*/i);
  if(wd){ var map = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6}, want = map[wd[1].toLowerCase()], k = shiftKey(TODAY,1);
    for(var i=0;i<7;i++){ if(dow(k) === want) break; k = shiftKey(k,1); } o.date = k; o.title = o.title.replace(wd[0],""); }
  o.title = o.title.replace(/\s+/g," ").trim();
  return o;
}

function insightsHTML(){
  var live = state.habits.filter(function(x){ return !x.archived; });
  var out = [];
  // 1) keep-rate by weekday across all habits, last 8 weeks
  var due = [0,0,0,0,0,0,0], hit = [0,0,0,0,0,0,0], k = shiftKey(TODAY,-55);
  for(var i=0;i<56;i++){
    var d = dow(k);
    live.forEach(function(x){
      if(x.createdDay && k < x.createdDay) return;
      if(habitDueOn(x,k)){ due[d]++; if(x.log && x.log[k]) hit[d]++; }
    });
    k = shiftKey(k,1);
  }
  var tot = due.reduce(function(a,b){ return a+b; },0);
  if(tot >= 21){
    var names = ["Sundays","Mondays","Tuesdays","Wednesdays","Thursdays","Fridays","Saturdays"];
    var rates = due.map(function(n,i){ return n >= 3 ? hit[i]/n : null; });
    var bi = -1, wi = -1;
    rates.forEach(function(r,i){ if(r===null) return; if(bi<0 || r > rates[bi]) bi = i; if(wi<0 || r < rates[wi]) wi = i; });
    if(bi > -1 && wi > -1 && bi !== wi && rates[bi] - rates[wi] >= 0.2){
      out.push('<div class="card"><div class="when m">Insight · your week</div><p><b>' + names[bi] + '</b> are your strongest day — you keep <b>' + Math.round(rates[bi]*100) + '%</b> of habits. <b>' + names[wi] + '</b> are where it slips (' + Math.round(rates[wi]*100) + '%). Plan the important reps accordingly.</p></div>');
    }
  }
  // 2) strongest vs most fragile habit (30d)
  var rated = live.map(function(x){
    var d2 = 0, h2 = 0, kk = TODAY;
    for(var j=0;j<30;j++){ if(!(x.createdDay && kk < x.createdDay) && habitDueOn(x,kk)){ d2++; if(x.log && x.log[kk]) h2++; } kk = shiftKey(kk,-1); }
    return { x:x, due:d2, rate: d2 ? h2/d2 : 0 };
  }).filter(function(r){ return r.due >= 10; });
  if(rated.length >= 2){
    rated.sort(function(a,b){ return b.rate - a.rate; });
    var top = rated[0], low = rated[rated.length-1];
    if(top.rate - low.rate >= 0.25){
      out.push('<div class="card"><div class="when m">Insight · habits</div><p><b>' + esc(top.x.icon||"") + ' ' + esc(top.x.title) + '</b> is rock solid (' + Math.round(top.rate*100) + '% this month). <b>' + esc(low.x.icon||"") + ' ' + esc(low.x.title) + '</b> is the fragile one (' + Math.round(low.rate*100) + '%) — shrink it until it\'s too easy to skip.</p></div>');
    }
  }
  // 3) journal effect on habits (last 30 days)
  var jd = 0, jdue = 0, jhit = 0, nd = 0, ndue = 0, nhit = 0, kk3 = shiftKey(TODAY,-1);
  for(var m=0;m<30;m++){
    var journ = !!state.journal[kk3], dd = 0, hh = 0;
    live.forEach(function(x){
      if(x.createdDay && kk3 < x.createdDay) return;
      if(habitDueOn(x,kk3)){ dd++; if(x.log && x.log[kk3]) hh++; }
    });
    if(dd){ if(journ){ jd++; jdue += dd; jhit += hh; } else { nd++; ndue += dd; nhit += hh; } }
    kk3 = shiftKey(kk3,-1);
  }
  if(jd >= 5 && nd >= 5 && jdue && ndue){
    var jr = jhit/jdue, nr = nhit/ndue;
    if(Math.abs(jr - nr) >= 0.12){
      out.push('<div class="card"><div class="when v">Insight · journal</div><p>On days you journal, you keep <b>' + Math.round(jr*100) + '%</b> of habits vs <b>' + Math.round(nr*100) + '%</b> on days you don\'t. ' + (jr > nr ? "The two feed each other — keep writing." : "Interesting — your quiet days are your strong days.") + '</p></div>');
    }
  }
  if(!out.length) return '<div class="sec">' + head("Insights", "patterns in your data") + '<div class="card"><p class="quiet" style="margin:0">Keep logging — once there\'s a couple of weeks of history, patterns show up here: your strongest weekday, which habit is fragile, what the journal does to your follow-through.</p></div></div>';
  return '<div class="sec">' + head("Insights", "patterns in your data") + out.join("") + '</div>';
}
function weekShapeNote(sum, n){
  var best = -1, bi = 1, worst = 1e9, wi = 1;
  for(var d=0; d<7; d++){ if(!n[d]) continue; var a = sum[d]/n[d]; if(a > best){ best = a; bi = d; } if(a < worst){ worst = a; wi = d; } }
  if(best < 0) return "Not enough history yet — close out a few days and your pattern shows up here.";
  var nm = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  if(bi === wi) return "Your days look pretty even so far.";
  return nm[bi] + " is your strongest day and " + nm[wi] + " your weakest. Put the hard thing on " + nm[bi] + ", and keep " + nm[wi] + " light on purpose.";
}

  var late = lateTasks(), fm = state.focus.filter(function(f){ return f.d >= shiftKey(TODAY,-6); }).reduce(function(a,f){ return a+(f.len||0); },0);
  var h = '<div class="ph"><div class="grow"><h1>Weekly review</h1><div class="sub">Week of ' + dayTitle(wk) + '</div></div></div>';
  h += '<div class="card grad"><div class="when">The week in numbers</div>' +
    '<div class="stats" style="margin:10px 0 0">' + statBox("Cleared", done, "items") + statBox("Solid days", solid + "/7", "hit the bar", true) +
    statBox("Focus", fm + "m", "deep work") + statBox("Carried over", late.length, "still open") + '</div></div>';
  h += '<div class="sec">' + head("Habits this week", "") + state.habits.filter(function(x){ return !x.archived; }).slice(0,8).map(function(x){
    var c = 0, kk = shiftKey(TODAY,-6); for(var j=0;j<7;j++){ if(x.log && x.log[kk]) c++; kk = shiftKey(kk,1); }

  if(state.goals.length) h += '<div class="sec">' + head("Where the goals stand", "") + state.goals.map(function(g){
    return '<div class="item"><div class="txt">' + esc(g.title) + '<span class="meta">' + goalNote(g) + esc(dueLabel(g)) + '</span></div>' +
      '<b style="font-family:var(--display)">' + goalPct(g) + '%</b></div>'; }).join("") + '</div>';

    '<label class="fl"><span>What got in the way?</span><textarea class="in" id="rb" style="min-height:70px">' + esc(rec.bad||"") + '</textarea></label>' +
    '<label class="fl"><span>One change for next week</span><input class="in" id="rn" maxlength="200" value="' + esc(rec.next||"") + '"></label>' +
    '<button class="btn hot wide" id="rsave2">Save review</button></div>';
  if(late.length) h += '<div class="btns"><button class="btn wide warm" id="pullall">Pull ' + late.length + ' overdue into today</button></div>';
  var past = Object.keys(state.reviews).sort().reverse().filter(function(x){ return x !== wk; }).slice(0,6);
  if(past.length) h += '<div class="sec">' + head("Past reviews", String(Object.keys(state.reviews).length)) + past.map(function(x){
    var r = state.reviews[x];
    return '<div class="jcard"><div class="jd">Week of ' + dayTitle(x) + '</div>' + (r.well?'<p><b>Well:</b> ' + esc(r.well) + '</p>':'') +
      (r.next?'<div class="jg">→ ' + esc(r.next) + '</div>':'') + '</div>'; }).join("") + '</div>';

function openSearch(){
  sheetOpen('<h2>Search</h2><input class="in" id="sq" placeholder="Tasks, goals, habits, notes…" autocomplete="off"><div id="sres"></div>' +
    '<div class="sheetbtns"><button class="ghost" data-close="1">Close</button></div>',
    function(w){
      var q = w.querySelector("#sq"), out = w.querySelector("#sres");
      function row(ic, title, meta, attr){
        return '<button class="item" style="width:100%;text-align:left" ' + attr + '><span style="color:var(--amber);flex:0 0 auto">' + ic + '</span>' +
          '<span class="txt">' + title + (meta?'<span class="meta">' + meta + '</span>':'') + '</span><span class="more">›</span></button>';
      }
      function go(){
        var v = q.value.trim().toLowerCase();
        if(v.length < 2){ out.innerHTML = '<p class="quiet">Type two letters and everything you\'ve ever planned shows up.</p>'; return; }
        var hits = [];
        state.goals.forEach(function(g){ if((g.title+" "+(g.why||"")).toLowerCase().indexOf(v) > -1) hits.push(row("◎", esc(g.title), "goal · " + goalPct(g) + "%", 'data-sg="' + g.id + '"')); });
        state.projects.forEach(function(p){ if(p.name.toLowerCase().indexOf(v) > -1) hits.push(row("▣", esc(p.name), "project", 'data-sp="' + p.id + '"')); });
        state.tasks.forEach(function(t){ if((t.title+" "+(t.notes||"")).toLowerCase().indexOf(v) > -1) hits.push(row(t.done?"✓":"○", esc(t.title), (t.done?"done · ":"") + (t.date?dayTitle(t.date):"no date"), 'data-st="' + t.id + '"')); });
        state.habits.forEach(function(x){ if(x.title.toLowerCase().indexOf(v) > -1) hits.push(row("↻", esc(x.title), "habit · " + habitRun(x) + "d run", 'data-sh="' + x.id + '"')); });
        state.notes.forEach(function(n){ if((n.t+" "+n.b).toLowerCase().indexOf(v) > -1) hits.push(row("🗒", esc(n.t||"Untitled"), "note", 'data-sn="' + n.id + '"')); });
        Object.keys(state.journal).forEach(function(k){ var j = state.journal[k]; if((j.text||"").toLowerCase().indexOf(v) > -1) hits.push(row("📓", esc((j.text||"").slice(0,60)), "journal · " + dayTitle(k), 'data-sj="' + k + '"')); });
        out.innerHTML = hits.length ? hits.slice(0,25).join("") : '<p class="quiet">Nothing matches that.</p>';
      }
      q.oninput = go; go();
      setTimeout(function(){ try{ q.focus(); }catch(e){} }, 60);
      w.addEventListener("click", function(ev){
        var b = ev.target.closest("[data-sg],[data-sp],[data-st],[data-sh],[data-sn],[data-sj]"); if(!b) return;
        var d = b.dataset; w.remove();
        if(d.sg){ go2("goals"); openGoal(d.sg); }
        else if(d.sp){ go2("projects"); openProject(d.sp); }
        else if(d.st){ openTask(d.st); }

        else if(d.sn){ go2("notes"); openNote(d.sn); }
        else if(d.sj){ dayPick = d.sj; go2("calendar"); }
      });
      function go2(t){ go(t); }
    });
}

var LINES = {

  mid:["Half a day is still a day. Keep the thread.","Decent. Tighten the list tomorrow and it lands.","Progress beats perfect."],
  slow:["Slow day. Happens. One item tomorrow restarts everything.","Not much moved — pick one thing for tomorrow and make it easy.","Reset, don't quit."],

function openRecap(){
  var s = todayStats(), left = openTasks().filter(function(t){ return t.date && t.date <= TODAY; });
  var tier = s.total === 0 ? "zero" : s.rate >= .75 ? "strong" : s.rate >= .4 ? "mid" : "slow";
  var perfect = s.total > 0 && s.done >= s.total;
  if(perfect){ var p = document.createElement("div"); p.innerHTML = partyHTML(); document.body.appendChild(p.firstChild); setTimeout(function(){ document.querySelectorAll(".party").forEach(function(n){ n.remove(); }); }, 3800); }
  sheetOpen('<div class="when">Day closed · ' + longDate(TODAY) + '</div>' +
    '<h2>' + (s.done ? "You cleared " + s.done + "." : "Nothing cleared today.") + '</h2>' +
    '<div class="stats" style="margin:10px 0"><div class="stat"><div class="lab">done</div><b style="color:var(--mint)">' + s.done + '</b></div>' +
    '<div class="stat"><div class="lab">left</div><b style="color:var(--amber)">' + left.length + '</b></div></div>' +
    '<p>' + pick(LINES[tier], TODAY+"r") + '</p>' +
    '<div class="fl mt"><span>How was today?</span><div class="moodrow" id="rmood">' + MOODS.map(function(m){ return '<button data-m="' + m + '">' + m + '</button>'; }).join("") + '</div></div>' +
    '<textarea class="in" id="rnote" placeholder="One honest line about today."></textarea>' +
    '<div class="sheetbtns"><button class="ghost" data-close="1">Not yet</button><button class="solid" id="rsave">Save' + (left.length ? " & push " + left.length : "") + '</button></div>',
    function(w){
      var mood = "";
      var ex = state.history[TODAY]; if(ex && ex.note) w.querySelector("#rnote").value = ex.note;
      w.querySelector("#rmood").addEventListener("click", function(ev){ var b = ev.target.closest("[data-m]"); if(!b) return;
        mood = b.dataset.m; w.querySelectorAll("#rmood [data-m]").forEach(function(c){ c.setAttribute("aria-pressed", String(c === b)); }); });
      w.querySelector("#rsave").onclick = function(){
        var note = w.querySelector("#rnote").value.trim();
        state.history[TODAY] = { done:s.done, total:s.total, rate:s.rate, note:note };
        if(mood || note){ var j = state.journal[TODAY] || {}; if(mood) j.mood = mood; if(note && !j.text) j.text = note; state.journal[TODAY] = j; }
        left.forEach(function(t){ t.date = shiftKey(TODAY,1); });
        checkBadges(); save(); pageClose(w); render();

function copyDay(){
  var s = todayStats(), lines = ["Momentum — " + longDate(TODAY), ""];
  var hb = habitsDueToday();
  if(hb.length){ lines.push("Habits:"); hb.forEach(function(x){ lines.push("  " + (x.log && x.log[TODAY] ? "[x]" : "[ ]") + " " + x.title); }); lines.push(""); }
  var ts = tasksOn(TODAY), dn = doneToday();
  if(ts.length){ lines.push("Open:"); ts.forEach(function(t){ lines.push("  [ ] " + t.title); }); lines.push(""); }
  if(dn.length){ lines.push("Done:"); dn.forEach(function(t){ lines.push("  [x] " + t.title); }); lines.push(""); }
  lines.push(s.done + " of " + s.total + " · streak " + streakCount() + " days");

  catch(e){ toast("Couldn't copy."); }
}
