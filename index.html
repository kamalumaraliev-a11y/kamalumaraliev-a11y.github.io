<style>
  :root{
    --ink:#12151F;          /* page */
    --card:#1B2030;         /* raised surface */
    --card-2:#242B3E;       /* higher surface */
    --line:#2E3750;         /* hairline */
    --text:#EAEDF6;         /* main text */
    --soft:#C6CCDF;         /* secondary text */
    --dim:#8A93AD;          /* quiet text */
    --amber:#F0B26B;        /* the one warm accent */
    --amber-soft:rgba(240,178,107,.14);
    --mint:#5AC79E;         /* done / good */
    --blue:#8CA2E8;         /* future / scheduled */
    --red:#E88C8C;          /* late, used sparingly */
    --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{margin:0; padding:0; width:100%; overflow-x:hidden; background:var(--ink); -webkit-text-size-adjust:100%}
  body{margin:0; padding:0; width:100%; min-height:100%; overflow-x:clip; background:var(--ink);
    font-family:var(--body); color:var(--text); overscroll-behavior-y:contain; touch-action:manipulation}
  #app{min-height:100vh; min-height:100dvh; max-width:640px; margin:0 auto;
    padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; font-size:inherit}
  input,select,textarea{font-family:inherit; font-size:16px; color:var(--text)}
  ::placeholder{color:#5E6780}
  h1,h2,h3{font-family:var(--display); font-weight:700; letter-spacing:-.01em; margin:0}
  .quiet{font-size:13px; color:var(--dim)}

  /* ---------- header ---------- */
  .top{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .wordmark{font-family:var(--display); font-weight:700; font-size:22px; line-height:1}
  .wordmark span{color:var(--amber)}
  .topdate{font-size:13px; color:var(--dim); flex:1; padding-top:2px}
  .streak{font-size:12.5px; color:var(--amber); background:var(--amber-soft);
    border:1px solid rgba(240,178,107,.3); padding:5px 10px; border-radius:99px; white-space:nowrap}
  .streak.cold{color:var(--dim); background:none; border-color:var(--line)}
  .gearbtn{width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center; color:var(--soft); flex:0 0 auto}

  /* ---------- today summary ring ---------- */
  .sumcard{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:14px 16px; margin-bottom:14px}
  .ringwrap{position:relative; width:64px; height:64px; flex:0 0 auto}
  .ringwrap svg{width:64px; height:64px; transform:rotate(-90deg)}
  .ringwrap .rpct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:700; font-size:16px}
  .sumtext h2{font-size:18px; margin-bottom:3px}
  .sumtext p{margin:0; font-size:13.5px; color:var(--dim); line-height:1.4}

  /* ---------- brief card ---------- */
  .brief{background:linear-gradient(165deg,var(--card-2),var(--card)); border:1px solid var(--line);
    border-radius:16px; padding:15px 16px; margin-bottom:14px}
  .brief .when{font-size:12.5px; color:var(--amber); margin-bottom:5px}
  .brief.pm .when{color:var(--blue)}
  .brief h2{font-size:19px; margin-bottom:6px}
  .brief p{margin:0 0 6px; font-size:14px; line-height:1.5; color:var(--soft)}
  .brief .quote{font-size:14px; color:var(--soft); border-top:1px solid var(--line); padding-top:10px; margin-top:10px; font-style:italic}
  .onething{display:flex; gap:8px; margin-top:10px}
  .onething input{flex:1; min-width:0; background:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px}
  .onething input:focus{outline:2px solid var(--amber); outline-offset:0}
  .focusline{display:flex; align-items:center; gap:8px; background:var(--amber-soft);
    border:1px solid rgba(240,178,107,.28); border-radius:10px; padding:9px 12px; margin-top:10px; font-size:14px}
  .focusline b{font-size:12px; color:var(--amber); font-weight:600; white-space:nowrap}

  /* ---------- up next ---------- */
  .upnext{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-left:3px solid var(--amber); border-radius:14px; padding:13px 14px; margin-bottom:14px}
  .upnext .un{flex:1; min-width:0}
  .upnext .un b{display:block; font-size:15px; font-weight:600; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis}
  .upnext .un span{font-size:12.5px; color:var(--dim)}
  .upnext .unlab{font-size:12px; color:var(--amber); margin-bottom:2px}
  .upnext .undo-btn{background:var(--amber); color:#1A1408; font-weight:600; font-size:13.5px;
    border-radius:10px; padding:9px 14px; flex:0 0 auto}

  /* ---------- sections & items ---------- */
  .sec{margin-bottom:18px}
  .sechead{display:flex; align-items:baseline; gap:8px; margin:0 2px 8px}
  .sechead b{font-size:14px; font-weight:600; color:var(--soft)}
  .sechead span{font-size:12.5px; color:var(--dim)}
  .sechead .spacer{flex:1}
  .sechead .headbtn{font-size:12.5px; color:var(--amber); padding:2px 4px}
  .item{display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line);
    border-radius:13px; padding:11px 12px; margin-bottom:7px}
  .item .box{width:24px; height:24px; border-radius:8px; border:1.6px solid var(--dim); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; transition:.15s; background:none}
  .item .box svg{width:14px; height:14px; opacity:0; transition:.15s}
  .item.done{opacity:.55}
  .item.done .box{background:var(--mint); border-color:var(--mint)}
  .item.done .box svg{opacity:1}
  .item.done .txt{text-decoration:line-through; text-decoration-color:rgba(234,237,246,.4)}
  .item .txt{flex:1; min-width:0; font-size:15px; line-height:1.35; overflow-wrap:anywhere}
  .item .meta{display:block; font-size:12px; color:var(--dim); margin-top:2px}
  .item .meta.late{color:var(--red)}
  .item.star{border-color:rgba(240,178,107,.4)}
  .starmark{color:var(--amber); font-size:14px; flex:0 0 auto}
  .item .more{color:var(--dim); font-size:18px; padding:2px 6px; flex:0 0 auto}
  .item.offduty{opacity:.5}
  .item.pinged{animation:ping .5s ease}
  @keyframes ping{0%{transform:scale(1)} 35%{transform:scale(1.02)} 100%{transform:scale(1)}}
  .empty{background:var(--card); border:1px dashed var(--line); border-radius:13px; padding:16px;
    font-size:13.5px; color:var(--dim); line-height:1.5; text-align:center}

  .wide{display:block; width:100%; text-align:center; background:var(--card); border:1px solid var(--line);
    border-radius:13px; padding:12px; font-size:14px; color:var(--soft); margin-bottom:8px}
  .wide.warm{background:var(--amber-soft); border-color:rgba(240,178,107,.3); color:var(--amber); font-weight:600}
  .linky{color:var(--amber); font-size:inherit; padding:0; text-decoration:underline; text-underline-offset:2px}

  /* ---------- days strip ---------- */
  .strip14{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 10px; margin:0 -2px 8px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch}
  .strip14::-webkit-scrollbar{display:none}
  .dcell{flex:0 0 auto; width:52px; padding:9px 4px 8px; border-radius:13px; border:1px solid var(--line);
    background:var(--card); text-align:center; transition:.15s}
  .dcell .dw{font-size:11px; color:var(--dim); display:block; margin-bottom:2px}
  .dcell .dn{font-family:var(--display); font-weight:700; font-size:17px; display:block}
  .dcell .dots{display:flex; gap:3px; justify-content:center; margin-top:5px; height:4px}
  .dcell .dots i{width:4px; height:4px; border-radius:50%; background:var(--dim)}
  .dcell .dots i.hot{background:var(--amber)}
  .dcell[aria-selected="true"]{background:var(--amber-soft); border-color:rgba(240,178,107,.45)}
  .dcell[aria-selected="true"] .dn{color:var(--amber)}
  .daypane h2{font-size:18px; margin:6px 2px 2px}
  .daypane .quiet{margin:0 2px 12px}
  .quickadd{display:flex; gap:8px; margin-bottom:16px}
  .quickadd input{flex:1; min-width:0; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:12px 13px}
  .quickadd input:focus{outline:2px solid var(--amber); outline-offset:0}
  .quickadd button{background:var(--amber); color:#1A1408; font-weight:600; border-radius:12px; padding:0 16px}

  /* ---------- goals ---------- */
  .gcard{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card);
    border:1px solid var(--line); border-radius:15px; padding:12px; margin-bottom:9px}
  .gcard .thumb{width:52px; height:52px; border-radius:12px; overflow:hidden; flex:0 0 auto;
    background:var(--card-2); display:flex; align-items:center; justify-content:center}
  .gcard .thumb img{width:100%; height:100%; object-fit:cover}
  .gcard .thumb u{font-family:var(--display); font-weight:700; font-size:20px; color:var(--amber); text-decoration:none}
  .gcard .gmid{flex:1; min-width:0}
  .gcard .gmid b{display:block; font-size:15.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .gcard .gmid i{display:block; font-style:normal; font-size:12.5px; color:var(--dim); margin:3px 0 6px}
  .gcard .gmid i b.gnum{display:inline; font-size:12.5px; color:var(--amber); font-weight:600}
  .gcard .next{display:block; font-size:12.5px; color:var(--soft); margin:0 0 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .gcard .next em{font-style:normal; color:var(--dim)}
  .gcard .chev{color:var(--dim); font-size:20px; flex:0 0 auto}
  .bar{display:block; height:5px; border-radius:99px; background:var(--card-2); overflow:hidden}
  .bar i{display:block; height:100%; border-radius:99px; background:var(--amber); transition:width .3s}
  .vbtn{display:block; width:100%; text-align:left; background:linear-gradient(165deg,var(--card-2),var(--card));
    border:1px solid var(--line); border-radius:15px; padding:14px 16px; margin-bottom:12px;
    font-family:var(--display); font-weight:700; font-size:16px}
  .vbtn span{display:block; font-family:var(--body); font-weight:400; font-size:12.5px; color:var(--dim); margin-top:3px}

  /* ---------- stats / progress ---------- */
  .weekcard{background:linear-gradient(165deg,var(--card-2),var(--card)); border:1px solid var(--line);
    border-radius:16px; padding:15px 16px; margin-bottom:14px}
  .weekcard .when{font-size:12.5px; color:var(--amber); margin-bottom:4px}
  .weekline{font-family:var(--display); font-weight:700; font-size:19px; margin-bottom:9px}
  .weekdots{display:flex; gap:7px; margin-bottom:10px}
  .wd{width:12px; height:12px; border-radius:50%; background:var(--card-2); border:1px solid var(--line)}
  .wd.part{background:var(--amber-soft); border-color:rgba(240,178,107,.4)}
  .wd.hit{background:var(--amber); border-color:var(--amber)}
  .weeknote{margin:0; font-size:13.5px; color:var(--soft); line-height:1.5}
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:11px 12px}
  .stat .lab{font-size:12px; color:var(--dim); margin-bottom:2px}
  .stat b{font-family:var(--display); font-weight:700; font-size:24px; line-height:1.1; display:block}
  .stat .sub{font-size:11.5px; color:var(--dim); margin-top:2px}
  .chart{display:flex; align-items:flex-end; gap:5px; height:96px; background:var(--card); border:1px solid var(--line);
    border-radius:13px; padding:12px 12px 8px}
  .chart .col{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end}
  .chart .col i{display:block; width:100%; max-width:18px; border-radius:5px 5px 2px 2px; background:var(--card-2); border:1px solid var(--line)}
  .chart .col.hit i{background:var(--amber); border-color:var(--amber)}
  .chart .col span{font-size:10px; color:var(--dim)}
  .chart .col.today span{color:var(--amber)}

  /* ---------- history ---------- */
  .day{border:1px solid var(--line); border-radius:13px; background:var(--card); margin-bottom:7px; overflow:hidden}
  .dayhead{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:11px 13px}
  .dname{font-size:14px; font-weight:600; flex:0 0 auto; min-width:104px}
  .dbar{flex:1; height:5px; border-radius:99px; background:var(--card-2); overflow:hidden}
  .dbar i{display:block; height:100%; background:var(--amber); border-radius:99px}
  .dcount{font-size:12.5px; color:var(--dim); flex:0 0 auto}
  .daybody{padding:2px 14px 12px; border-top:1px solid var(--line)}
  .daybody .cap{font-size:12px; color:var(--dim); margin:10px 0 4px}
  .dline{font-size:13.5px; color:var(--soft); padding:3px 0}
  .dline.dim{color:var(--dim)}
  .dtime{color:var(--dim); font-size:11.5px}
  .dnote{font-size:13.5px; color:var(--text); font-style:italic; border-left:2px solid var(--amber);
    padding-left:10px; margin:10px 0 2px}
  .done-thing{font-size:13.5px; color:var(--soft); margin:10px 0 2px}

  /* ---------- goal page ---------- */
  .page{position:fixed; inset:0; z-index:40; background:var(--ink); overflow-y:auto; overscroll-behavior:contain}
  .pbar{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px;
    background:rgba(18,21,31,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    padding:12px 14px; border-bottom:1px solid var(--line)}
  .pbar .back{font-size:15px; color:var(--amber); font-weight:600}
  .pbar .sp{flex:1}
  .pwrap{max-width:640px; margin:0 auto; padding:16px 16px 60px}
  .hero{position:relative; display:block; width:100%; border-radius:18px; overflow:hidden; margin-bottom:14px;
    background:var(--card); border:1px solid var(--line); height:210px}
  .hero .shotbg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(24px) brightness(.5); transform:scale(1.2)}
  .hero .pic{position:relative; width:100%; height:100%; object-fit:contain}
  .hero.fill .pic{object-fit:cover}
  .hero .cap{position:absolute; left:12px; bottom:10px; font-size:12.5px; color:#fff;
    background:rgba(0,0,0,.45); padding:4px 10px; border-radius:99px; backdrop-filter:blur(4px)}
  .hero .dots, .gshot .dots{position:absolute; right:12px; bottom:12px; display:flex; gap:4px}
  .hero .dots i, .gshot .dots i{width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.4)}
  .hero .dots i.on, .gshot .dots i.on{background:#fff}
  .nohero{display:block; width:100%; border:1px dashed var(--line); border-radius:18px; background:var(--card);
    color:var(--dim); font-size:13.5px; line-height:1.55; padding:26px 20px; margin-bottom:14px; text-align:center}
  .ptitle{font-size:24px; margin:2px 2px 4px}
  .pwhy{font-size:14px; color:var(--soft); margin:0 2px 12px; line-height:1.5}
  .scoreboard{background:linear-gradient(165deg,var(--card-2),var(--card)); border:1px solid var(--line);
    border-radius:16px; padding:15px 16px; margin-bottom:12px}
  .sblab{font-size:12.5px; color:var(--amber); margin-bottom:3px}
  .sbnum{font-family:var(--display); font-weight:700; font-size:34px; line-height:1.05; margin-bottom:8px}
  .sbnum span{font-size:16px; color:var(--soft); margin-left:6px; font-weight:500}
  .sbrow{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:7px}
  .sbnow{font-size:13.5px; color:var(--soft)}
  .sbpct{font-family:var(--display); font-weight:700; font-size:15px; color:var(--amber)}
  .sbgap{font-size:12.5px; color:var(--dim); margin-top:8px}
  .gbtns{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
  .gbtn{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:9px 13px; font-size:13.5px; color:var(--soft)}
  .gbtn.hot{background:var(--amber); border-color:var(--amber); color:#1A1408; font-weight:600}
  .spark{width:100%; height:88px; display:block; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:6px}
  .spark .ln{fill:none; stroke:var(--amber); stroke-width:2}
  .spark .tl{stroke:var(--line); stroke-width:1; stroke-dasharray:4 4}
  .sparkfoot{display:flex; justify-content:space-between; font-size:11px; color:var(--dim); margin-top:5px; padding:0 2px}
  .log{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:5px 13px}
  .logrow{display:flex; align-items:baseline; gap:9px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px}
  .logrow:last-child{border-bottom:none}
  .logrow em{font-style:normal; color:var(--mint)}
  .logrow s{flex:1; text-decoration:none; color:var(--soft); overflow-wrap:anywhere}
  .logrow.rep s{color:var(--dim)}
  .logrow u{text-decoration:none; color:var(--dim); font-size:11.5px; white-space:nowrap}
  .morebtn{display:block; width:100%; text-align:center; padding:10px; color:var(--amber); font-size:13.5px}
  .pics{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px}
  .pics button{flex:0 0 auto; width:74px; height:74px; border-radius:12px; overflow:hidden;
    background:var(--card); border:1px solid var(--line); color:var(--dim); font-size:12.5px}
  .pics img{width:100%; height:100%; object-fit:cover; display:block}
</style>

<style>
  /* ---------- bottom nav + add button ---------- */
  .navwrap{position:fixed; left:0; right:0; bottom:0; z-index:30; pointer-events:none;
    padding:0 14px calc(10px + env(safe-area-inset-bottom))}
  .nav{pointer-events:auto; display:flex; gap:2px; max-width:640px; margin:0 auto;
    background:rgba(27,32,48,.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line); border-radius:18px; padding:6px}
  .nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 2px 7px; border-radius:13px; color:var(--dim); font-size:11px; transition:.15s}
  .nav button svg{width:20px; height:20px}
  .nav button[aria-selected="true"]{color:var(--amber); background:var(--amber-soft)}
  .fab{position:fixed; right:16px; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:31;
    width:54px; height:54px; border-radius:17px; background:var(--amber); color:#1A1408;
    font-size:28px; line-height:1; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 20px rgba(240,178,107,.35)}
  @media(min-width:700px){ .fab{right:calc(50% - 320px + 16px)} }

  /* ---------- sheets / overlays ---------- */
  .scrim{position:fixed; inset:0; z-index:50; background:rgba(10,12,19,.66); display:flex;
    align-items:flex-end; justify-content:center; overscroll-behavior:contain}
  .sheet{width:100%; max-width:640px; max-height:88%; overflow-y:auto; background:var(--card);
    border:1px solid var(--line); border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:19px; margin:4px 0 8px}
  .sheet .when{font-size:12.5px; color:var(--amber); margin-bottom:2px}
  .sheet p{font-size:13.5px; color:var(--soft); line-height:1.5}
  .sheet textarea{width:100%; min-height:88px; background:var(--ink); border:1px solid var(--line);
    border-radius:12px; padding:11px 12px; margin-top:12px; resize:vertical}
  .sheet textarea:focus, .sheet input:focus, .sheet select:focus{outline:2px solid var(--amber); outline-offset:0}
  .sheetbtns{display:flex; gap:9px; margin-top:16px}
  .ghost{flex:1; padding:12px; border-radius:12px; border:1px solid var(--line); color:var(--soft); font-size:14.5px}
  .solid{flex:1.4; padding:12px; border-radius:12px; background:var(--amber); color:#1A1408; font-weight:600; font-size:14.5px}
  .bigin{width:100%; background:var(--ink); border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-top:10px}
  .fieldrow{display:flex; gap:9px; margin-top:12px}
  .fl{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
  .fl span{font-size:12.5px; color:var(--dim)}
  .fl input,.fl select{width:100%; background:var(--ink); border:1px solid var(--line); border-radius:11px; padding:10px 11px}
  .chipset{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
  .chip{border:1px solid var(--line); background:var(--ink); color:var(--soft); border-radius:99px;
    padding:8px 13px; font-size:13.5px; transition:.15s}
  .chip[aria-pressed="true"]{background:var(--amber-soft); border-color:rgba(240,178,107,.45); color:var(--amber); font-weight:600}
  .dayset{display:flex; flex-wrap:wrap; gap:6px}
  .dchip{border:1px solid var(--line); background:var(--ink); color:var(--soft); border-radius:9px;
    padding:7px 9px; font-size:12.5px}
  .dchip[aria-pressed="true"]{background:var(--amber-soft); border-color:rgba(240,178,107,.45); color:var(--amber); font-weight:600}
  .seg{display:flex; gap:4px; background:var(--ink); border:1px solid var(--line); border-radius:12px; padding:4px; margin-top:6px}
  .seg button{flex:1; padding:9px 4px; border-radius:9px; color:var(--dim); font-size:13.5px}
  .seg button[aria-pressed="true"]{background:var(--card-2); color:var(--text); font-weight:600}
  .nudgeme{animation:nudge .45s ease}
  @keyframes nudge{0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)}}

  /* bottom action menu */
  .scrim.bottom{align-items:flex-end}
  .menu{width:100%; max-width:640px; background:var(--card); border:1px solid var(--line);
    border-radius:20px 20px 0 0; padding:10px 10px calc(14px + env(safe-area-inset-bottom))}
  .menutitle{font-size:13.5px; color:var(--dim); padding:8px 12px 10px; border-bottom:1px solid var(--line);
    margin-bottom:6px; overflow-wrap:anywhere}
  .mrow{display:block; width:100%; text-align:left; padding:13px 12px; border-radius:11px; font-size:15px}
  .mrow:active{background:var(--card-2)}
  .mrow.danger{color:var(--red)}
  .mrow.cancel{color:var(--dim); text-align:center; margin-top:4px; border-top:1px solid var(--line); border-radius:0}

  /* tally in recap */
  .tally{display:flex; gap:10px; margin:12px 0}
  .tally>div{flex:1; background:var(--ink); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center}
  .tally b{font-family:var(--display); font-weight:700; font-size:22px; display:block}
  .tally span{font-size:11.5px; color:var(--dim)}

  /* nudge bar */
  .nudgebar{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:11px 13px;
    font-size:13px; color:var(--dim); line-height:1.5; margin-bottom:14px}
  .nudgebar b{color:var(--soft); font-weight:600}
  .nudgebar button{color:var(--amber); font-weight:600; margin-left:8px}
  .nudgebar.on{border-color:rgba(90,199,158,.3)}
  .nudgebar.on b{color:var(--mint)}

  /* focus timer */
  .timer{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:13px; padding:10px 13px; margin-bottom:14px}
  .clock{font-family:var(--display); font-weight:700; font-size:22px; min-width:64px}
  .tlab{flex:1; font-size:12.5px; color:var(--dim); line-height:1.35}
  .tbtn{border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; color:var(--soft)}

  /* vision board + viewer */
  .board{position:fixed; inset:0; z-index:60; background:var(--ink); overflow-y:auto; padding:16px}
  .bhead{display:flex; align-items:center; justify-content:space-between; max-width:640px; margin:0 auto 14px}
  .bhead h2{font-size:22px}
  .bhead button{color:var(--amber); font-weight:600}
  .bgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:640px; margin:0 auto}
  .bcell{position:relative; border-radius:15px; overflow:hidden; height:170px; border:1px solid var(--line); background:var(--card); text-align:left}
  .bcell .shotbg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(20px) brightness(.5); transform:scale(1.2)}
  .bcell .pic{position:relative; width:100%; height:100%; object-fit:contain}
  .bcell.fill .pic{object-fit:cover}
  .bcell .veil{position:absolute; inset:auto 0 0; height:60%; background:linear-gradient(transparent,rgba(10,12,19,.85))}
  .bcell u{position:absolute; left:11px; right:11px; bottom:9px; text-decoration:none; font-size:13.5px; font-weight:600; color:#fff}
  .bcell u i{display:block; font-style:normal; font-weight:400; font-size:11.5px; color:rgba(255,255,255,.75); margin-top:2px}
  .gshot{position:relative; display:block; width:100%; border-radius:15px; overflow:hidden; height:150px;
    border:1px solid var(--line); background:var(--card); margin-bottom:10px}
  .gshot .shotbg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(20px) brightness(.5); transform:scale(1.2)}
  .gshot .pic{position:relative; width:100%; height:100%; object-fit:contain}
  .gshot .veil{position:absolute; inset:auto 0 0; height:55%; background:linear-gradient(transparent,rgba(10,12,19,.8))}
  .gshot .cue{position:absolute; left:12px; bottom:10px; font-size:12.5px; color:#fff}
  .viewer{position:fixed; inset:0; z-index:70; background:rgba(8,10,16,.97); display:flex; flex-direction:column; padding:14px}
  .vclose{position:absolute; top:14px; right:14px; z-index:3; width:38px; height:38px; border-radius:12px;
    background:rgba(27,32,48,.8); color:var(--text); font-size:16px}
  .vstage{position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center}
  .vstage img{max-width:100%; max-height:100%; border-radius:14px}
  .vtap{position:absolute; top:0; bottom:0; width:34%}
  .vmeta{max-width:640px; margin:10px auto 0; width:100%}
  .vmeta h3{font-size:18px; margin-bottom:4px}
  .vmeta p{font-size:13.5px; color:var(--soft); margin:0 0 8px}
  .vmeta .goalfoot{font-size:12px; color:var(--dim); margin-top:8px}
  .tgt{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-size:13.5px; color:var(--soft); margin-bottom:6px}
  .tgt b{font-family:var(--display); font-weight:700; font-size:17px; color:var(--text)}
  .tgt s{text-decoration:none; color:var(--dim)}
  .tgt em{font-style:normal; color:var(--amber); font-weight:600}
  .tgt u{text-decoration:none; color:var(--mint); font-size:12px}
  .vrow{display:flex; gap:8px; max-width:640px; margin:12px auto 0; width:100%}

  /* toast */
  .toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:80; background:var(--card-2); border:1px solid var(--line); color:var(--text);
    padding:11px 16px; border-radius:13px; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.4);
    display:flex; align-items:center; gap:12px; max-width:88vw}
  .toast .undo{color:var(--amber); font-weight:600}

  :is(button,input,select,textarea):focus-visible{outline:2px solid var(--amber); outline-offset:1px}
  @media(prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div>
      <div class="wordmark">Momentum<span>.</span></div>
      <div class="topdate" id="datestr"></div>
    </div>
    <div style="flex:1"></div>
    <div class="streak cold" id="streak">no streak yet</div>
    <button class="gearbtn" id="gear" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
    </button>
  </div>

  <div id="view"></div>
</div>

<div class="navwrap">
  <div class="nav" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Today</button>
    <button role="tab" data-tab="days" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      Days</button>
    <button role="tab" data-tab="goals" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>
      Goals</button>
    <button role="tab" data-tab="progress" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-8M21 19H3"/></svg>
      Progress</button>

<script>
(function(){
  "use strict";

  /* ---------------- storage (unchanged format) ---------------- */
  var KEY = "momentum:v1";
  var mem = null;
  var hasStore = typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";

  var state = {
    name:"", habits:[], tasks:[], goals:[], history:{}, oneThing:{},
    lastActive:null, briefSeen:{}, totalDone:0, bestStreak:0
  };

  var DAY_START = 4; // the day rolls over at 4am, not midnight
  function fmtKey(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function todayKey(d){
    var x = d ? new Date(d.getTime()) : new Date();
    x.setHours(x.getHours() - DAY_START);
    return fmtKey(x); }
  function shiftKey(base, days){ var d = new Date(base+"T12:00:00"); d.setDate(d.getDate()+days); return fmtKey(d); }
  function daysBetween(a,b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/86400000); }
  function uid(){ return Math.random().toString(36).slice(2,9); }

  var TODAY = todayKey();
  var saveTimer = null;

  function localGet(){ try{ return window.localStorage.getItem(KEY); }catch(e){ return null; } }
  function localSet(v){ try{ window.localStorage.setItem(KEY, v); }catch(e){} }

  async function load(){
    if(hasStore){
      try{
        var r = await window.storage.get(KEY);
        if(r && r.value){ Object.assign(state, JSON.parse(r.value)); return; }
      }catch(e){}
      return;
    }
    var raw = localGet();
    if(raw){ try{ Object.assign(state, JSON.parse(raw)); return; }catch(e){} }
    if(mem) Object.assign(state, mem);
  }
  function save(){
    mem = JSON.parse(JSON.stringify(state));
    var payload = JSON.stringify(state);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      if(hasStore){ try{ window.storage.set(KEY, payload); }catch(e){ console.error("save failed", e); } }
      else { localSet(payload); }
    }, 250);
  }

      "Momentum is expensive to build and cheap to keep. Keep it.",

  function pick(arr, seed){
    var s = 0; seed = String(seed);
    for(var i=0;i<seed.length;i++) s = (s*31 + seed.charCodeAt(i)) % 99991;
    return arr[s % arr.length];
  }

  /* ---------------- day math (unchanged) ---------------- */
  function dayStats(key){
    var t = state.tasks.filter(function(x){ return x.date === key || (x.doneAt && x.doneDay === key); });
    var total = 0, done = 0;
    state.habits.forEach(function(h){
      if(h.createdDay && h.createdDay > key) return;
      if(!habitDueOn(h, key)) return;
      total++; if(h.log && h.log[key]) done++;
    });
    t.forEach(function(x){ total++; if(x.done && x.doneDay === key) done++; });
    return { total: total, done: done, rate: total ? done/total : 0 };
  }
  var DAYNAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function dowOf(key){ return new Date(key+"T12:00:00").getDay(); }
  function habitDueOn(x, key){
    if(!x.days || !x.days.length) return true;
    return x.days.indexOf(dowOf(key)) !== -1;
  }
  function habitsDueToday(){ return state.habits.filter(function(x){ return habitDueOn(x, TODAY); }); }
  function habitDaysLabel(x){
    if(!x.days || !x.days.length || x.days.length === 7) return "";
    return x.days.slice().sort().map(function(n){ return DAYNAMES[n]; }).join(" ");
  }
  function todayStats(){
    var total = 0, done = 0;
    habitsDueToday().forEach(function(h){ total++; if(h.log && h.log[TODAY]) done++; });
    openTasks().concat(doneToday()).forEach(function(x){ total++; if(x.done) done++; });
    return { total: total, done: done, rate: total ? done/total : 0 };
  }
  function openTasks(){ return state.tasks.filter(function(t){ return !t.done && t.date <= TODAY; }); }
  function laterTasks(){ return state.tasks.filter(function(t){ return !t.done && t.date > TODAY; }); }
  function doneToday(){ return state.tasks.filter(function(t){ return t.done && t.doneDay === TODAY; }); }
  function qualifies(s){ return s.total > 0 && s.done >= 1 && s.rate >= 0.6; }
  function streakCount(){
    var n = 0, k = TODAY;
    if(qualifies(todayStats())) { n = 1; }
    k = shiftKey(TODAY, -1);
    while(state.history[k] && qualifies(state.history[k])){ n++; k = shiftKey(k, -1); }
    return n;
  }
  function rollover(){
    if(!state.lastActive){ state.lastActive = TODAY; return; }
    if(state.lastActive === TODAY) return;
    var k = state.lastActive;
    var gap = daysBetween(k, TODAY);
    for(var i=0;i<gap;i++){
      var s = dayStats(k);
      if(!state.history[k]) state.history[k] = { done:s.done, total:s.total, rate:s.rate, note:(state.history[k]||{}).note || "" };
      else { state.history[k].done = s.done; state.history[k].total = s.total; state.history[k].rate = s.rate; }
      k = shiftKey(k, 1);
    }
    state.lastActive = TODAY;
    save();
  }

    }

  /* ----------- vision: pictures live in IndexedDB, unchanged ----------- */
  var SHOTS = {};
  var shotDB = null;
  function visionOpen(){
    if(shotDB) return Promise.resolve(shotDB);
    return new Promise(function(res){
      var rq;
      try{ rq = indexedDB.open("momentum-vision", 1); }catch(e){ res(null); return; }
      rq.onupgradeneeded = function(){ try{ rq.result.createObjectStore("shots", { keyPath:"id" }); }catch(e){} };
      rq.onsuccess = function(){ shotDB = rq.result; res(shotDB); };
      rq.onerror = function(){ res(null); };
    });
  }
  function shotsLoad(){
    return visionOpen().then(function(db){
      if(!db) return;
      return new Promise(function(res){
        var rq;
        try{ rq = db.transaction("shots", "readonly").objectStore("shots").getAll(); }catch(e){ res(); return; }
        rq.onsuccess = function(){ (rq.result || []).forEach(function(r){ SHOTS[r.id] = r; }); res(); };
        rq.onerror = function(){ res(); };
      });
    }).catch(function(){});
  }
  function shotPut(rec){
    SHOTS[rec.id] = rec;
    return visionOpen().then(function(db){
      if(!db) return;
      try{ db.transaction("shots", "readwrite").objectStore("shots").put(rec); }catch(e){}
    });
  }
  function shotDrop(id){
    delete SHOTS[id];
    return visionOpen().then(function(db){
      if(!db) return;
      try{ db.transaction("shots", "readwrite").objectStore("shots").delete(id); }catch(e){}
    });
  }
  function shrinkImage(file){
    return new Promise(function(res, rej){
      var fr = new FileReader();
      fr.onerror = function(){ rej(); };
      fr.onload = function(){
        var im = new Image();
        im.onerror = function(){ rej(); };
        im.onload = function(){
          var w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
          if(!w || !h){ rej(); return; }
          var s = Math.min(1, 1100 / Math.max(w, h));
          var c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          var q = 0.74, out = c.toDataURL("image/jpeg", q);
          while(out.length > 900000 && q > 0.38){ q -= 0.12; out = c.toDataURL("image/jpeg", q); }
          res(out);
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function addShot(goalId){

    inp.style.position = "fixed"; inp.style.left = "-9999px";
    inp.onchange = function(){
      var f = inp.files && inp.files[0];
      if(!f){ inp.remove(); return; }
      toast("Saving picture…");
      shrinkImage(f).then(function(src){
        var rec = { id: uid(), src: src, t: Date.now(), day: TODAY, cap: "" };
        return shotPut(rec).then(function(){
          g.shots = g.shots || [];
          g.shots.unshift(rec.id);
          save(); render();
          toast("Pinned to your vision.");
        });
      }).catch(function(){
        toast("Couldn't read that picture.");
      }).then(function(){ inp.remove(); });
    };
    document.body.appendChild(inp);
    inp.click();
  }
  function goalShots(g){ return (g.shots || []).filter(function(id){ return SHOTS[id]; }); }
  function anyShots(){ return state.goals.some(function(g){ return goalShots(g).length; }); }

  /* ----------- goal numbers, unchanged math ----------- */
  function nfmt(n){
    n = +n || 0;
    var a = Math.abs(n);
    if(a >= 1000000) return (n / 1000000).toFixed(a < 10000000 ? 1 : 0).replace(/\.0$/, "") + "M";
    if(a >= 1000) return (n / 1000).toFixed(a < 100000 ? 1 : 0).replace(/\.0$/, "") + "K";
    return String(Math.round(n * 10) / 10);
  }
  function nsep(n){
    var x = +n || 0;
    x = Math.round(x * 100) / 100;
    try{ return x.toLocaleString(); }catch(e){ return String(x); }
  }
  function goalBase(g){
    var m = g.marks || [];
    return m.length ? (+m[0].v || 0) : null;
  }
  function goalDown(g){
    if(!(g.target > 0)) return false;
    var b = goalBase(g);
    return b !== null ? b > g.target : (+g.cur || 0) > g.target;
  }
  function goalPct(g){
    if(g.target > 0){
      var cur = +g.cur || 0;
      if(goalDown(g)){
        var b = goalBase(g);
        if(b === null) b = cur;
        if(b <= g.target) return 100;
        return Math.max(0, Math.min(100, Math.round((b - cur) / (b - g.target) * 100)));
      }
      return Math.max(0, Math.min(100, Math.round(cur / g.target * 100)));
    }
    var all = state.tasks.filter(function(t){ return t.goalId === g.id; });
    var done = all.filter(function(t){ return t.done; }).length;
    return all.length ? Math.round(done / all.length * 100) : 0;
  }
  function goalNote(g){
    if(g.target > 0) return nfmt(g.cur || 0) + (goalDown(g) ? " → " : " of ") + '<b class="gnum">' + nfmt(g.target) + (g.unit ? " " + esc(g.unit) : "") + '</b>' + " · " + goalPct(g) + "%";
    var all = state.tasks.filter(function(t){ return t.goalId === g.id; });
    if(!all.length) return "no number on it yet";
    return all.filter(function(t){ return t.done; }).length + " of " + all.length + " cleared";
  }
  function tgtHTML(g, pct){
    if(!(g.target > 0)) return "";
    var marks = g.marks || [], note = "";
    if(marks.length > 1){
      var first = marks[0], gain = (+g.cur || 0) - (+first.v || 0), n = daysBetween(first.d, TODAY);
      if(gain !== 0 && n > 0) note = '<u>' + (gain > 0 ? "+" : "−") + nfmt(Math.abs(gain)) + " in " + n + (n === 1 ? " day" : " days") + '</u>';
    }
    return '<div class="tgt"><b>' + nfmt(g.cur || 0) + '</b>' +
      '<s>' + (goalDown(g) ? "→ " : "of ") + nfmt(g.target) + (g.unit ? " " + esc(g.unit) : "") + '</s>' +
      '<em>' + pct + '%</em>' + note + '</div>';
  }
  function tgtBigHTML(g, pct){
    if(!(g.target > 0)) return "";
    var cur = +g.cur || 0, down = goalDown(g), marks = g.marks || [];
    var gap = down ? cur - g.target : g.target - cur;
    var unit = g.unit ? " " + esc(g.unit) : "";
    var note = "";
    if(marks.length > 1){
      var first = marks[0], gain = cur - (+first.v || 0), n = daysBetween(first.d, TODAY);
      if(gain !== 0) note = (gain > 0 ? "+" : "\u2212") + nsep(Math.abs(gain)) + " in " + n + (n === 1 ? " day" : " days");
    }
    return '<div class="scoreboard">' +
      '<div class="sblab">' + (down ? "Getting down to" : "Going for") + '</div>' +

  /* ----------- sheets ----------- */

    var w = sheetOpen(

      '<div class="sheetbtns"><button class="ghost" data-close="1">Cancel</button><button class="solid" id="lgsave">Log it</button></div>',
      function(w){

          w.remove(); save(); render();

  function shotAge(r){

  /* ----------- vision board + viewer ----------- */

  function openViewer(goalId, idx){
    var g = state.goals.filter(function(x){ return x.id === goalId; })[0];
    if(!g || !goalShots(g).length) return;
    var i = Math.max(0, idx || 0), armed = false, armTimer = null;
    var w = document.createElement("div");
    w.className = "viewer";
    document.body.appendChild(w);
    function paint(){
      var ids = goalShots(g);
      if(!ids.length){ w.remove(); render(); return; }
      if(i >= ids.length) i = ids.length - 1;
      var rec = SHOTS[ids[i]], pct = goalPct(g);
      w.innerHTML =
        '<button class="vclose" id="vx" aria-label="Close">✕</button>' +
        '<div class="vstage"><img src="' + rec.src + '" alt="' + esc(rec.cap || g.title) + '">' +
          (ids.length > 1
            ? '<button class="vtap" style="left:0" data-vstep="-1" aria-label="Previous picture"></button>' +
              '<button class="vtap" style="right:0" data-vstep="1" aria-label="Next picture"></button>'
            : '') +
        '</div>' +
        '<div class="vmeta"><h3>' + esc(g.title) + '</h3>' +
          (rec.cap ? '<p>' + esc(rec.cap) + '</p>' : (g.why ? '<p>' + esc(g.why) + '</p>' : '')) +
          tgtHTML(g, pct) +
          '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
          '<div class="goalfoot">' + (ids.length > 1 ? (i + 1) + " of " + ids.length + " · " : "") + shotAge(rec) + '</div>' +
        '</div>' +
        '<div class="vrow">' +
          '<button class="gbtn" data-vcap="1">' + (rec.cap ? "Edit note" : "Add a note") + '</button>' +
          (ids.length > 1 ? '<button class="gbtn" data-vfirst="1">Make it the cover</button>' : '') +
          '<button class="gbtn" data-vdel="1">' + (armed ? "Tap again to remove" : "Remove") + '</button>' +
        '</div>';
    }
    paint();
    w.addEventListener("click", function(ev){
      var ids = goalShots(g);
      if(ev.target.id === "vx"){ w.remove(); return; }
      var st = ev.target.closest("[data-vstep]");
      if(st){ armed = false; i = (i + (+st.getAttribute("data-vstep")) + ids.length) % ids.length; paint(); return; }
      if(ev.target.closest("[data-vcap]")){
        var cur = SHOTS[ids[i]];
        sheetOpen('<div class="when">Note on this picture</div>' +
          '<input type="text" id="vcapin" class="bigin" maxlength="90" value="' + esc(cur.cap || "") + '" placeholder="Feb 2026 — day one">' +
          '<div class="sheetbtns"><button class="ghost" data-close="1">Cancel</button><button class="solid" id="vcapok">Save</button></div>',
          function(sw){
            sw.querySelector("#vcapok").onclick = function(){
              cur.cap = sw.querySelector("#vcapin").value.trim().slice(0, 90);
              shotPut(cur); sw.remove(); paint(); render();
            };
          });
        return;
      }
      if(ev.target.closest("[data-vfirst]")){
        var id = ids[i];
        g.shots = [id].concat((g.shots || []).filter(function(x){ return x !== id; }));
        i = 0; armed = false; save(); paint(); render(); toast("That's the cover now.");
        return;
      }
      if(ev.target.closest("[data-vdel]")){
        if(!armed){
          armed = true; paint();
          clearTimeout(armTimer);
          armTimer = setTimeout(function(){ armed = false; paint(); }, 3500);
          return;
        }
        armed = false; clearTimeout(armTimer);
        var gone = ids[i];
        g.shots = (g.shots || []).filter(function(x){ return x !== gone; });
        shotDrop(gone);
        save(); paint(); render();
        return;
      }
    });
  }

  /* ----------- one full page per goal ----------- */
  var goalRepaint = null;
  function goalTasks(g){ return state.tasks.filter(function(t){ return t.goalId === g.id; }); }
  function goalHabits(g){ return (state.habits || []).filter(function(x){ return x.goalId === g.id; }); }
  function nextStep(g){
    var open = goalTasks(g).filter(function(t){ return !t.done; })
      .sort(function(a,b){ return (a.date || "9999-99-99") < (b.date || "9999-99-99") ? -1 : 1; });
    return open.length ? open[0] : null;
  }
  function gcardHTML(g){
    var ids = goalShots(g), pct = goalPct(g), nx = nextStep(g);
    return '<button class="gcard" data-gopen="' + g.id + '">' +
      '<span class="thumb">' +
        (ids.length
          ? '<img src="' + SHOTS[ids[0]].src + '" alt="" loading="lazy">'
          : '<u>' + esc((g.title || "?").trim().charAt(0).toUpperCase()) + '</u>') +
      '</span>' +
      '<span class="gmid">' +
        '<b>' + esc(g.title) + '</b>' +
        '<i>' + goalNote(g) + dueLabel(g) + '</i>' +
        (nx ? '<span class="next"><em>Next:</em> ' + esc(nx.title) + '</span>' : '') +
        '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
      '</span>' +
      '<span class="chev">›</span>' +
    '</button>';
  }
  function goalStats(g){
    var all = goalTasks(g);
    var done = all.filter(function(t){ return t.done; });
    var hb = goalHabits(g);
    var wk = shiftKey(TODAY, -6);
    var days = {}, last7 = 0;
    done.forEach(function(t){
      if(t.doneDay){ days[t.doneDay] = 1; if(t.doneDay >= wk) last7++; }
    });
    hb.forEach(function(x){
      Object.keys(x.log || {}).forEach(function(k){
        if(x.log[k]){ days[k] = 1; if(k >= wk) last7++; }
      });
    });
    return {
      all: all, done: done,
      open: all.filter(function(t){ return !t.done; }),
      habits: hb, last7: last7,
      activeDays: Object.keys(days).length,
      since: g.createdDay ? Math.max(0, daysBetween(g.createdDay, TODAY)) : null
    };
  }
  function statBox(label, val, sub){
    return '<div class="stat"><div class="lab">' + label + '</div><b>' + val + '</b><div class="sub">' + sub + '</div></div>';
  }
  function sparkHTML(g){
    var m = (g.marks || []).slice();
    if(m.length < 2) return "";
    m.sort(function(a, b){ return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
    var span = Math.max(1, daysBetween(m[0].d, m[m.length - 1].d));
    var vals = m.map(function(p){ return +p.v || 0; });
    var top = Math.max(g.target > 0 ? g.target : 0, Math.max.apply(null, vals)) || 1;
    var W = 300, H = 84, pad = 5;
    var pts = m.map(function(p, i){
      var x = pad + (daysBetween(m[0].d, p.d) / span) * (W - pad * 2);
      var y = H - pad - (vals[i] / top) * (H - pad * 2);
      return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
    });
    var d = pts.map(function(p, i){ return (i ? "L" : "M") + p[0] + " " + p[1]; }).join(" ");
    var area = d + " L" + pts[pts.length - 1][0] + " " + (H - pad) + " L" + pts[0][0] + " " + (H - pad) + " Z";
    var ty = g.target > 0 ? Math.round((H - pad - (g.target / top) * (H - pad * 2)) * 10) / 10 : null;
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
        '<defs><linearGradient id="sgrad" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="rgba(240,178,107,.3)"/>' +
          '<stop offset="1" stop-color="rgba(240,178,107,0)"/>' +
        '</linearGradient></defs>' +
        (ty !== null ? '<line class="tl" x1="0" y1="' + ty + '" x2="' + W + '" y2="' + ty + '" vector-effect="non-scaling-stroke"></line>' : '') +
        '<path d="' + area + '" fill="url(#sgrad)"></path>' +
        '<path class="ln" d="' + d + '" vector-effect="non-scaling-stroke"></path>' +
      '</svg>' +
      '<div class="sparkfoot"><span>' + dayTitle(m[0].d) + '</span><span>' +
        (g.target > 0 ? "target " + nfmt(g.target) + (g.unit ? " " + esc(g.unit) : "") : "") +
      '</span><span>' + dayTitle(m[m.length - 1].d) + '</span></div>';
  }
  function addGoalTask(goalId, gd, root, after){
    var el = root ? root.querySelector("#gnewtask") : null;
    var v = el ? el.value.trim().slice(0, 140) : "";
    if(!v){
      if(el){ el.classList.add("nudgeme"); setTimeout(function(){ el.classList.remove("nudgeme"); }, 500); el.focus(); }
      toast("Type the task first, then Add.");
      return;
    }
    if(gd.when === "habit"){
      state.habits.push({ id:uid(), title:v, log:{}, logAt:{}, days:[], createdDay:TODAY, goalId:goalId });
      toast("Repeats every day, tied to this goal.");
    } else {
      var when = TODAY;
      if(gd.when === "tomorrow") when = shiftKey(TODAY, 1);
      if(gd.when === "pick"){
        var pd = root ? root.querySelector("#gpickdate") : null;
        when = pd && pd.value ? pd.value : shiftKey(TODAY, 1);
      }
      state.tasks.push({ id:uid(), title:v, date:when, time:"", goalId:goalId, star:false, done:false, createdDay:TODAY });
      toast(when === TODAY ? "On today's board." : "Set for " + dayTitle(when) + ".");

  function openGoal(goalId){

      h += '<div class="sec">' + head("Where you stand", dueLabel(g).replace(" · ", "")) +
        '<div class="stats">' +
          statBox("Days in", st.since === null ? "—" : st.since, "since you set it") +

      var sp = sparkHTML(g);

        '</div>' +
        (gdraft.when === "pick" ? '<input type="date" class="bigin" id="gpickdate" value="' + (gdraft.date || shiftKey(TODAY, 1)) + '" min="' + TODAY + '">' : '') +
      '</div>';

            return '<div class="item">' +

              '<div class="txt" data-toggle="' + t.id + '" data-kind="task">' + esc(t.title) +

              '</div></div>';

      var rows = st.done.map(function(t){ return { title: t.title, day: t.doneDay, at: t.doneAt || 0, rep: false }; });
      st.habits.forEach(function(x){
        Object.keys(x.log || {}).forEach(function(k){
          if(x.log[k]) rows.push({ title: x.title, day: k, at: (x.logAt || {})[k] || 0, rep: true });

      rows.sort(function(a, b){
