        (rows.length
          ? '<div class="log">' + rows.slice(0, lim).map(function(r){
              return '<div class="logrow' + (r.rep ? " rep" : "") + '"><em>✓</em><s>' + esc(r.title) + '</s><u>' + (r.day ? dayTitle(r.day) : "") + '</u></div>';
            }).join("") + '</div>' +
            (rows.length > lim ? '<button class="morebtn" data-gmore="1">Show all ' + rows.length + '</button>' : '')
          : '<div class="empty">Nothing finished for this yet. Add a task above and it shows up on Today on the day you picked — everything you clear lands here.</div>') +
      '</div>';

      if(st.habits.length){
        h += '<div class="sec">' + head("On repeat", String(st.habits.length)) +
          st.habits.map(function(x){
            var run = habitRun(x), kept = !!(x.log && x.log[TODAY]);
            return '<div class="item' + (kept ? " done" : "") + '">' +
              '<button class="box" data-toggle="' + x.id + '" data-kind="habit" aria-label="Mark done">' + CHECK + '</button>' +
              '<div class="txt" data-toggle="' + x.id + '" data-kind="habit">' + esc(x.title) +
              '<span class="meta">' + (run > 0 ? run + " day run" : habitDaysLabel(x)) + '</span>' +
              '</div></div>';
          }).join("") + '</div>';
      }

      h += '<div class="sec">' + head("Pictures", ids.length ? String(ids.length) : "") +
        '<div class="pics">' +
          ids.map(function(id, k){ return '<button data-gpic="' + k + '"><img src="' + SHOTS[id].src + '" alt=""></button>'; }).join("") +
          '<button data-addshot="' + g.id + '">+ Add</button>' +
        '</div></div>';

      h += '</div>';
      w.innerHTML = h;
      w.scrollTop = y;
    }
    w.addEventListener("click", function(ev){
      if(ev.target.closest("[data-gback]")){ close(); return; }
      if(ev.target.closest("[data-gmore]")){ showAll = true; paint(); return; }
      if(ev.target.closest("[data-grename]")){ openRename(goalId, paint); return; }
      var gw = ev.target.closest("[data-gwhen]");
      if(gw){
        var tf0 = w.querySelector("#gnewtask"); if(tf0) gdraft.text = tf0.value;
        var pd0 = w.querySelector("#gpickdate"); if(pd0) gdraft.date = pd0.value;
        gdraft.when = gw.getAttribute("data-gwhen");
        paint();
        var tf1 = w.querySelector("#gnewtask"); if(tf1) tf1.focus();
        return;
      }
      if(ev.target.closest("[data-gadd]")){ addGoalTask(goalId, gdraft, w, paint); return; }
      if(ev.target.closest("[data-gfill]")){ var gf = state.goals.filter(function(x){ return x.id === goalId; })[0]; if(gf){ gf.fill = !gf.fill; save(); paint(); } return; }
      var pic = ev.target.closest("[data-gpic]");
      if(pic){ openViewer(goalId, +pic.getAttribute("data-gpic")); return; }
      if(ev.target.closest("[data-gdel]")){
        if(!armed){
          armed = true; paint();
          clearTimeout(armTimer);
          armTimer = setTimeout(function(){ armed = false; paint(); }, 3500);
          return;
        }
        clearTimeout(armTimer);
        var g = state.goals.filter(function(x){ return x.id === goalId; })[0];
        if(g && g.shots) g.shots.forEach(function(sid){ shotDrop(sid); });
        state.goals = state.goals.filter(function(x){ return x.id !== goalId; });
        state.tasks.forEach(function(t){ if(t.goalId === goalId) t.goalId = ""; });
        (state.habits || []).forEach(function(x){ if(x.goalId === goalId) x.goalId = ""; });
        close(); save(); render();
        return;
      }
    });
    goalRepaint = paint;
    paint();
    w.scrollTop = 0;
  }
  function visionBtnHTML(){
    if(!anyShots()) return "";
    var n = state.goals.reduce(function(a, g){ return a + goalShots(g).length; }, 0);
    return '<button class="vbtn" id="visionbtn">Open the vision board' +
      '<span>' + n + (n === 1 ? " picture" : " pictures") + ' of where this is going</span></button>';
  }
  function viewGoals(){
    var h = visionBtnHTML();
    if(!state.goals.length){
      h += '<div class="empty">No goals yet. Tap + and pick Goal — name something worth chasing, then hang tasks and a number off it.</div>';
      return h;
    }
    h += state.goals.map(function(g){ return gcardHTML(g); }).join("");
    h += '<p class="quiet" style="text-align:center; margin-top:12px">Tap + to add another goal.</p>';
    return h;
  }


  /* ---------------- Progress ---------------- */
  var openDay = null;
  var histLimit = 30;
  function allActiveDays(){
    var set = {};
    Object.keys(state.history || {}).forEach(function(k){ set[k] = 1; });
    state.tasks.forEach(function(t){ if(t.doneDay) set[t.doneDay] = 1; });
    state.habits.forEach(function(x){ Object.keys(x.log || {}).forEach(function(k){ set[k] = 1; }); });
    Object.keys(state.oneThing || {}).forEach(function(k){ set[k] = 1; });
    return Object.keys(set).sort().reverse();
  }
  function dayDetail(key){
    var tasks = state.tasks.filter(function(t){ return t.doneDay === key; });
    var habits = state.habits.filter(function(x){ return x.log && x.log[key]; });
    var rec = state.history[key] || null;
    var live = key === TODAY ? todayStats() : null;
    return {
      tasks: tasks, habits: habits,
      note: rec ? (rec.note || "") : "",
      one: (state.oneThing || {})[key] || "",
      done: live ? live.done : (rec ? rec.done : tasks.length + habits.length),
      total: live ? live.total : (rec ? rec.total : tasks.length + habits.length),
      rate: live ? live.rate : (rec ? rec.rate : 1)
    };
  }
  function historyHTML(){
    var days = allActiveDays();
    if(!days.length){
      return '<div class="sec">' + head("History", "0 days") +
        '<div class="empty">Nothing logged yet. Once you finish a day, it lands here — what you cleared, and the line you wrote about it.</div></div>';
    }
    var shown = days.slice(0, histLimit);
    var out = '<div class="sec">' + head("History", days.length + (days.length===1?" day":" days"));
    out += shown.map(function(k){
      var dd = dayDetail(k), pctv = Math.round(dd.rate*100), open = openDay === k;
      var row = '<div class="day' + (open ? " open" : "") + '">' +
        '<button class="dayhead" data-day="' + k + '">' +
          '<span class="dname">' + dayTitle(k) + '</span>' +
          '<span class="dbar"><i style="width:' + pctv + '%"></i></span>' +
          '<span class="dcount">' + dd.done + '/' + dd.total + '</span>' +
        '</button>';
      if(open){
        row += '<div class="daybody">';
        if(dd.one) row += '<p class="done-thing"><b>One thing:</b> ' + esc(dd.one) + '</p>';
        if(dd.habits.length){
          row += '<div class="cap">Repeating kept</div>' +
            dd.habits.map(function(x){ return '<div class="dline">✓ ' + esc(x.title) + '</div>'; }).join("");
        }
        if(dd.tasks.length){
          row += '<div class="cap">Cleared</div>' +
            dd.tasks.sort(function(a,b){ return (a.doneAt||0) - (b.doneAt||0); }).map(function(t){
              return '<div class="dline">✓ ' + esc(t.title) +
                (t.doneAt ? ' <span class="dtime">' + new Date(t.doneAt).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) + '</span>' : '') +
                '</div>';
            }).join("");
        }
        if(!dd.habits.length && !dd.tasks.length) row += '<div class="dline dim">Nothing cleared this day.</div>';
        if(dd.note) row += '<p class="dnote">' + esc(dd.note) + '</p>';
        row += '</div>';
      }
      return row + '</div>';
    }).join("");
    if(days.length > histLimit) out += '<button class="wide" id="moredays">Show ' + Math.min(30, days.length - histLimit) + ' more days</button>';
    return out + '</div>';
  }
  function viewProgress(){
    var days = [], k = shiftKey(TODAY, -13);
    for(var i=0;i<14;i++){
      var s = k === TODAY ? todayStats() : (state.history[k] || {done:0,total:0,rate:0});
      days.push({ key:k, s:s });
      k = shiftKey(k, 1);
    }
    var max = Math.max(1, Math.max.apply(null, days.map(function(d){ return d.s.done; })));
    var totalAll = Object.keys(state.history).reduce(function(a,kk){ return a + (state.history[kk].done||0); }, 0) + todayStats().done;
    var st = streakCount();
    if(st > (state.bestStreak||0)){ state.bestStreak = st; save(); }
    var hit = days.filter(function(d){ return qualifies(d.s); }).length;

    var wk = [], wkey = shiftKey(TODAY, -6), wdone = 0, wsolid = 0;
    for(var wi=0; wi<7; wi++){
      var ws = wkey === TODAY ? todayStats() : (state.history[wkey] || {done:0,total:0,rate:0});
      wdone += ws.done || 0;
      if(qualifies(ws)) wsolid++;
      wk.push({key:wkey, s:ws});
      wkey = shiftKey(wkey, 1);
    }
    var h = '<div class="weekcard">' +
      '<div class="when">Last seven days</div>' +
      '<div class="weekline">' + wdone + ' cleared · ' + wsolid + ' solid ' + (wsolid===1?"day":"days") + '</div>' +
      '<div class="weekdots">' + wk.map(function(x){
        return '<span class="wd' + (qualifies(x.s) ? " hit" : (x.s.done ? " part" : "")) + '" title="' + x.key + '"></span>';
      }).join("") + '</div>' +
      '<p class="weeknote">' + (
        wsolid >= 5 ? "Five or more solid days in a week is the whole game. Don't get clever, just repeat it." :
        wsolid >= 3 ? "More on than off. Push one more day over the line next week." :
        wsolid >= 1 ? "It's started. The gap between one solid day and three is smaller than it looks." :
        wdone > 0   ? "Things are getting done, but no day cleared the bar yet. Try a shorter list." :
                      "Nothing logged this week. One item today puts you back on the board."
      ) + '</p></div>';

    h += '<div class="stats">' +
      statBox("Current run", st, (st===1?"day":"days") + " in a row") +
      statBox("Best run", state.bestStreak||0, "days") +
      statBox("Cleared all time", totalAll, "items") +
      statBox("Last 14 days", hit + '<span style="font-size:15px;opacity:.5">/14</span>', "solid days") +
    '</div>';

    h += '<div class="sec">' + head("Two weeks of output", "items per day") + '<div class="chart">' +
      days.map(function(d){
        var hgt = Math.round(d.s.done / max * 100);
        var lbl = new Date(d.key+"T12:00:00").toLocaleDateString(undefined,{weekday:"narrow"});
        return '<div class="col ' + (qualifies(d.s)?"hit ":"") + (d.key===TODAY?"today":"") + '">' +
          '<i style="height:' + Math.max(3, hgt) + '%"></i><span>' + lbl + '</span></div>';
      }).join("") + '</div></div>';

    h += historyHTML();
    h += '<p class="quiet" style="text-align:center; margin:4px 0 0">Backups moved to Settings — the gear up top.</p>';
    return h;
  }

  /* ---------------- render ---------------- */
  function drawTop(){
    var st = streakCount();
    var el = document.getElementById("streak");
    el.textContent = st > 0 ? "🔥 " + st + " day run" : "no streak yet";
    el.className = "streak" + (st > 0 ? "" : " cold");
    document.getElementById("datestr").textContent =
      new Date().toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
  }
  function render(){
    drawTop();
    document.getElementById("view").innerHTML =
      tab === "today" ? viewToday() :
      tab === "days" ? viewDays() :
      tab === "goals" ? viewGoals() : viewProgress();
    document.querySelectorAll('.nav [role="tab"]').forEach(function(b){
      b.setAttribute("aria-selected", String(b.dataset.tab === tab));
    });
    if(timer.running) paintClock();
    if(goalRepaint) goalRepaint();
  }

  /* ---------------- actions ---------------- */
  function toast(msg){
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);
  }
  var CHEERS = ["Logged.","That's one.","Down it goes.","Counted.","Good.","Chalk it up.","Cleared."];
  function undoToast(msg, fn){
    document.querySelectorAll(".toast").forEach(function(n){ n.remove(); });
    var t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = '<span>' + esc(msg) + '</span><button class="undo">Undo</button>';
    document.body.appendChild(t);
    var tm = setTimeout(function(){ t.remove(); }, 7000);
    t.querySelector(".undo").onclick = function(){ clearTimeout(tm); t.remove(); fn(); };
  }
  function toggle(id, kind){
    if(kind === "habit"){
      var hb = state.habits.find(function(x){ return x.id===id; });
      if(!hb) return;
      hb.log = hb.log || {}; hb.logAt = hb.logAt || {};
      if(hb.log[TODAY]){ delete hb.log[TODAY]; delete hb.logAt[TODAY]; }
      else { hb.log[TODAY] = 1; hb.logAt[TODAY] = Date.now(); justDone = id; toast(pick(CHEERS, id + Date.now())); }
    } else {
      var t = state.tasks.find(function(x){ return x.id===id; });
      if(!t) return;
      t.done = !t.done;
      if(t.done){ t.doneAt = Date.now(); t.doneDay = TODAY; justDone = id; toast(pick(CHEERS, id + Date.now())); }
      else { delete t.doneAt; delete t.doneDay; }
    }
    save(); render();
    if(justDone) setTimeout(function(){ justDone = null; }, 700);
  }

  /* ---------------- the + sheet ---------------- */
  function openAdd(prefKind, prefDate){
    var ad = { kind: prefKind || "task", when: "today", date: "", time: "", goal: "", days: [], span: "open" };
    if(prefDate && prefDate > TODAY){ ad.when = "pick"; ad.date = prefDate; }
    var wrap;
    function body(){
      var h = '<div class="when">Add something</div>' +
        '<div class="seg">' +
          '<button data-akind="task" aria-pressed="' + (ad.kind==="task") + '">Task</button>' +
          '<button data-akind="habit" aria-pressed="' + (ad.kind==="habit") + '">Repeats</button>' +
          '<button data-akind="goal" aria-pressed="' + (ad.kind==="goal") + '">Goal</button>' +
        '</div>';
      if(ad.kind === "goal"){
        h += '<input type="text" id="a_title" class="bigin" placeholder="A goal worth chasing" maxlength="80">' +
          '<input type="text" id="a_why" class="bigin" placeholder="Why it matters (optional)" maxlength="110">' +
          '<div class="chipset">' +
            [["day","By tonight"],["week","This week"],["month","This month"],["open","No deadline"]].map(function(s){
              return '<button class="chip" data-aspan="'+s[0]+'" aria-pressed="'+(ad.span===s[0])+'">'+s[1]+'</button>';
            }).join('') + '</div>';
      } else if(ad.kind === "habit"){
        h += '<input type="text" id="a_title" class="bigin" placeholder="Something you\'ll do again and again" maxlength="140">' +
          '<div class="fl" style="margin-top:12px"><span>Which days? (none = every day)</span>' +
          '<div class="dayset">' + DAYNAMES.map(function(n,i){
            return '<button class="dchip" data-adow="'+i+'" aria-pressed="'+(ad.days.indexOf(i)!==-1)+'">'+n+'</button>';
          }).join('') + '</div></div>' +
          (state.goals.length ? '<label class="fl" style="margin-top:12px"><span>Part of a goal?</span><select id="a_goal">' +
            '<option value="">Not linked</option>' +
            state.goals.map(function(g){ return '<option value="'+g.id+'"'+(ad.goal===g.id?" selected":"")+'>'+esc(g.title)+'</option>'; }).join("") +
          '</select></label>' : '');
      } else {
        h += '<input type="text" id="a_title" class="bigin" placeholder="What needs doing?" maxlength="140" autocapitalize="sentences">' +
          '<div class="chipset">' +
            '<button class="chip" data-awhen="today" aria-pressed="' + (ad.when==="today") + '">Today</button>' +
            '<button class="chip" data-awhen="tomorrow" aria-pressed="' + (ad.when==="tomorrow") + '">Tomorrow</button>' +
            '<button class="chip" data-awhen="pick" aria-pressed="' + (ad.when==="pick") + '">Pick a date</button>' +
          '</div>' +
          (ad.when === "pick" ? '<input type="date" class="bigin" id="a_date" value="' + (ad.date || shiftKey(TODAY,1)) + '" min="' + TODAY + '">' : '') +
          '<div class="fieldrow">' +
            '<label class="fl"><span>At a set time?</span><input type="time" id="a_time" value="' + (ad.time || "") + '"></label>' +
            (state.goals.length ? '<label class="fl"><span>Part of a goal?</span><select id="a_goal">' +
              '<option value="">Not linked</option>' +
              state.goals.map(function(g){ return '<option value="'+g.id+'"'+(ad.goal===g.id?" selected":"")+'>'+esc(g.title)+'</option>'; }).join("") +
            '</select></label>' : '') +
          '</div>';
      }
      h += '<div class="sheetbtns"><button class="ghost" data-close="1">Cancel</button>' +
        '<button class="solid" id="a_go">' + (ad.kind==="goal" ? "Add goal" : ad.kind==="habit" ? "Add repeating task" : "Add task") + '</button></div>';
      return h;
    }
    function grab(){
      var t = wrap.querySelector("#a_title"); if(t) ad.text = t.value;
      var d = wrap.querySelector("#a_date"); if(d) ad.date = d.value;
      var tm = wrap.querySelector("#a_time"); if(tm) ad.time = tm.value;
      var g = wrap.querySelector("#a_goal"); if(g) ad.goal = g.value;
      var wy = wrap.querySelector("#a_why"); if(wy) ad.why = wy.value;
    }
    function repaint(){
      wrap.querySelector(".sheet").innerHTML = body();
      var t = wrap.querySelector("#a_title"); if(t && ad.text) t.value = ad.text;
      var wy = wrap.querySelector("#a_why"); if(wy && ad.why) wy.value = ad.why;
      var x = wrap.querySelector("[data-close]");
      if(x) x.onclick = function(){ wrap.remove(); };
    }
    function submit(){
      grab();
      var v = (ad.text || "").trim();
      var t = wrap.querySelector("#a_title");
      if(!v){
        if(t){ t.classList.add("nudgeme"); setTimeout(function(){ t.classList.remove("nudgeme"); }, 500); t.focus(); }
        toast(ad.kind==="goal" ? "Name the goal first." : "Type it first, then Add.");
        return;
      }
      if(ad.kind === "goal"){
        var due = "";
        if(ad.span === "day") due = TODAY;
        else if(ad.span === "week") due = shiftKey(TODAY, 7);
        else if(ad.span === "month") due = shiftKey(TODAY, 30);
        state.goals.push({ id:uid(), title:v.slice(0,80), why:(ad.why||"").trim().slice(0,110),
          span:ad.span, due:due, createdDay:TODAY });
        toast("Goal set.");
      } else if(ad.kind === "habit"){
        state.habits.push({ id:uid(), title:v.slice(0,140), log:{}, logAt:{}, days:ad.days.slice(), createdDay:TODAY, goalId:ad.goal || "" });
        toast(ad.days.length ? "Repeats " + ad.days.slice().sort().map(function(n){ return DAYNAMES[n]; }).join(" ") + "."
                             : "Repeats every day.");
      } else {
        var when = TODAY;
        if(ad.when === "tomorrow") when = shiftKey(TODAY, 1);
        if(ad.when === "pick") when = ad.date || shiftKey(TODAY, 1);
        state.tasks.push({ id:uid(), title:v.slice(0,140), date:when, time:ad.time || "",
          goalId:ad.goal || "", star:false, done:false, createdDay:TODAY });
        toast(when === TODAY ? "On today's board." : "Set for " + dayTitle(when) + ".");
      }
      wrap.remove(); save(); render();
    }
    wrap = sheetOpen(body(), function(w){
      w.addEventListener("click", function(ev){
        var k = ev.target.closest("[data-akind]");
        if(k){ grab(); ad.kind = k.getAttribute("data-akind"); repaint(); return; }
        var wh = ev.target.closest("[data-awhen]");
        if(wh){ grab(); ad.when = wh.getAttribute("data-awhen"); repaint(); return; }
        var sp = ev.target.closest("[data-aspan]");
        if(sp){ grab(); ad.span = sp.getAttribute("data-aspan"); repaint(); return; }
        var dw = ev.target.closest("[data-adow]");
        if(dw){
          var n = +dw.getAttribute("data-adow"), i = ad.days.indexOf(n);
          if(i === -1) ad.days.push(n); else ad.days.splice(i,1);
          dw.setAttribute("aria-pressed", String(ad.days.indexOf(n) !== -1));
          return;
        }
        if(ev.target.closest("#a_go")){ submit(); return; }
      });
      w.addEventListener("keydown", function(ev){
        if(ev.key === "Enter" && ev.target.id === "a_title") submit();
      });
      setTimeout(function(){ var f = w.querySelector("#a_title"); if(f) f.focus(); }, 60);
    });
  }

  /* ---------------- global click routing ---------------- */
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-toggle],[data-more],[data-day],[data-daypick],[role='tab'],#fab,#addbtn,#onebtn,#namebtn,#endday,#copyday,#moredays,#gear,#rethink,#tstart,#treset,#asknudge,#testnudge,#visionbtn,#pullall,#toggledone,#qaddbtn,[data-vopen],[data-addshot],[data-glog],[data-gtarget],[data-gopen]");
    if(!el) return;
    var d = el.dataset;
    if(el.getAttribute("role") === "tab" && d.tab){ tab = d.tab; if(tab === "days") dayPick = TODAY; render(); return; }
    if(d.toggle){ toggle(d.toggle, d.kind); return; }
    if(d.more){ openRowMenu(d.more, d.kind); return; }
    if(d.daypick){ dayPick = d.daypick; render(); return; }
    if(el.id === "fab"){ openAdd(tab === "goals" ? "goal" : "task", tab === "days" ? dayPick : ""); return; }
    if(el.id === "qaddbtn"){ quickAdd(); return; }
    if(el.id === "pullall"){
      var late = openTasks().filter(function(t){ return t.date < TODAY; });
      var fromDates = late.map(function(t){ return { t:t, was:t.date }; });
      late.forEach(function(t){ t.date = TODAY; });
      save(); render();
      undoToast(late.length + " moved to today", function(){
        fromDates.forEach(function(r){ r.t.date = r.was; });
        save(); render();
      });
      return;
    }
    if(el.id === "toggledone"){ showDone = !showDone; render(); return; }
    if(el.id === "visionbtn"){ openBoard(); return; }
    if(d.vopen){ openViewer(d.vopen, 0); return; }
    if(d.addshot){ addShot(d.addshot); return; }
    if(d.glog){ openLog(d.glog); return; }
    if(d.gtarget){ openTarget(d.gtarget); return; }
    if(d.gopen){ openGoal(d.gopen); return; }
    if(el.id === "namebtn"){
      var nm = document.getElementById("namein");
      state.name = (nm ? nm.value.trim() : "").slice(0,24);
      state.onboarded = true; save(); render(); return;
    }
    if(el.id === "onebtn"){
      var v = document.getElementById("onein").value.trim();
      if(!v) return;
      state.oneThing[TODAY] = v; save(); render(); return;
    }
    if(el.id === "asknudge"){ askNudges(); return; }
    if(el.id === "testnudge"){ fire("This is what it looks like.", "Momentum will use these sparingly. Three a day, maximum.", "test"); return; }
    if(el.id === "endday"){ openRecap(); return; }
    if(el.id === "copyday"){ copyDay(); return; }
    if(d.day){ openDay = (openDay === d.day) ? null : d.day; render(); return; }
    if(el.id === "moredays"){ histLimit += 30; render(); return; }
    if(el.id === "gear"){ openSettings(); return; }
    if(el.id === "rethink"){ delete state.oneThing[TODAY]; save(); render(); return; }
    if(el.id === "tstart"){ timerToggle(); return; }
    if(el.id === "treset"){ timerReset(); return; }
  });
  function quickAdd(){
    var el = document.getElementById("qadd");
    if(!el) return;
    var v = el.value.trim().slice(0, 140);
    if(!v){
      el.classList.add("nudgeme"); toast("Type the task first, then Add.");
      setTimeout(function(){ el.classList.remove("nudgeme"); }, 500); el.focus();
      return;
    }
    state.tasks.push({ id:uid(), title:v, date:dayPick, time:"", goalId:"", star:false, done:false, createdDay:TODAY });
    toast(dayPick === TODAY ? "On today's board." : "Set for " + dayTitle(dayPick) + ".");
    save(); render();
    var again = document.getElementById("qadd");
    if(again) again.focus();
  }
  document.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    if(e.target.id === "qadd") quickAdd();
    if(e.target.id === "onein"){ var b = document.getElementById("onebtn"); if(b) b.click(); }
    if(e.target.id === "namein"){ var b2 = document.getElementById("namebtn"); if(b2) b2.click(); }
  });

  /* ---------------- copy day / backups (formats unchanged) ---------------- */
  function copyDay(){
    var s = todayStats(), lines = [];
    lines.push("MOMENTUM — " + new Date().toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"}));
    lines.push(s.done + "/" + s.total + " done (" + Math.round(s.rate*100) + "%) · streak " + streakCount() + " days");
    if(state.oneThing[TODAY]) lines.push("One thing: " + state.oneThing[TODAY]);
    lines.push("");
    if(state.habits.length){
      lines.push("EVERY DAY");
      state.habits.forEach(function(x){
        lines.push("  [" + (x.log && x.log[TODAY] ? "x" : " ") + "] " + x.title);
      });
      lines.push("");
    }
    var late = openTasks().filter(function(t){ return t.date < TODAY; });
    if(late.length){
      lines.push("CARRIED OVER");
      late.forEach(function(t){ lines.push("  [ ] " + t.title + " (" + daysBetween(t.date, TODAY) + "d late)"); });
      lines.push("");
    }
    var now = state.tasks.filter(function(t){ return !t.done && t.date === TODAY; }).sort(byStar);
    lines.push("TODAY");
    if(!now.length) lines.push("  (nothing left)");
    now.forEach(function(t){ lines.push("  [ ] " + (t.time ? clockOf(t) + " " : "") + t.title + (t.star ? " *" : "")); });
    var dn = doneToday();
    if(dn.length){
      lines.push("");
      lines.push("CLEARED");
      dn.forEach(function(t){ lines.push("  [x] " + t.title); });
    }
    var later = laterTasks();
    if(later.length){
      lines.push("");
      lines.push("COMING UP");
      later.sort(function(a,b){ return a.date < b.date ? -1 : 1; }).slice(0,10).forEach(function(t){
        lines.push("  " + t.date + (t.time ? " " + clockOf(t) : "") + " — " + t.title);
      });
    }
    var text = lines.join("\n");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("Copied. Paste it anywhere."); })
        .catch(function(){ showText(text); });
    } else { showText(text); }
  }
  function doBackup(){
    var text = JSON.stringify(state);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("Backup copied. Paste it somewhere safe."); })
        .catch(function(){ showText(text); });
    } else { showText(text); }
  }
  function fullPack(){
    var shots = [], ids = Object.keys(SHOTS);
    for(var i = 0; i < ids.length; i++){ if(SHOTS[ids[i]]) shots.push(SHOTS[ids[i]]); }
    return { app:"momentum", v:1, saved:new Date().toISOString(), state:state, shots:shots };
  }
  function shareFile(blob){
    try{
      if(!navigator.share || !navigator.canShare || !window.File) return false;
      var f = new File([blob], "momentum-backup-" + TODAY + ".json", { type:"application/json" });
      if(!navigator.canShare({ files:[f] })) return false;
      navigator.share({ files:[f], title:"Momentum backup", text:"My Momentum goals and pictures." }).then(function(){
        toast("Sent. On the other device tap Load a backup file.");
      }, function(){});
      return true;
    }catch(e){ return false; }
  }
  function doBackupFile(){
    try{
      var blob = new Blob([JSON.stringify(fullPack())], { type:"application/json" });
      if(shareFile(blob)) return;
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "momentum-backup-" + TODAY + ".json";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ try{ document.body.removeChild(a); }catch(e){} URL.revokeObjectURL(url); }, 4000);
      var n = Object.keys(SHOTS).length;
      toast(n ? "Backup saved — " + n + " picture" + (n === 1 ? "" : "s") + " included." : "Backup saved.");
    }catch(e){ toast("Could not save the file."); }
  }
  function doRestoreFile(){
    var inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "application/json,.json,text/plain";
    inp.style.display = "none";
    document.body.appendChild(inp);
    inp.onchange = function(){
      var f = inp.files && inp.files[0];
      try{ document.body.removeChild(inp); }catch(e){}
      if(!f) return;
      var fr = new FileReader();
      fr.onerror = function(){ toast("Could not read that file."); };
      fr.onload = function(){
        var pack;
        try{ pack = JSON.parse(String(fr.result)); }
        catch(e){ toast("That isn't a Momentum backup."); return; }
        applyPack(pack);
      };
      fr.readAsText(f);
    };
    inp.click();
  }
  function applyPack(pack){
    var st = (pack && pack.state) ? pack.state : pack;
    if(!st || !Array.isArray(st.tasks) || !Array.isArray(st.habits)){
      toast("That isn't a Momentum backup."); return;
    }
    var shots = (pack && Array.isArray(pack.shots)) ? pack.shots : [];
    state = Object.assign({ name:"", habits:[], tasks:[], goals:[], history:{}, oneThing:{},
      lastActive:TODAY, briefSeen:{}, totalDone:0, bestStreak:0 }, st);
    state.lastActive = TODAY;
    save();
    var chain = Promise.resolve(), kept = 0;
    shots.forEach(function(rec){
      if(!rec || !rec.id || !rec.src) return;
      kept++;
      chain = chain.then(function(){ return shotPut(rec); });
    });
    chain.catch(function(){}).then(function(){
      render();
      toast(kept ? "Restored — " + kept + " picture" + (kept === 1 ? "" : "s") + " too." : "Restored.");
    });
  }
  function doRestore(){
    sheetOpen('<div class="when">Restore from a backup</div>' +
      '<h2>This replaces everything.</h2>' +
      '<p style="margin:0">Paste a backup below. Your current tasks, repeating tasks and history will be overwritten.</p>' +
      '<textarea id="restorein" placeholder="Paste your backup here"></textarea>' +
      '<div class="sheetbtns"><button class="ghost" data-close="1">Cancel</button>' +
      '<button class="solid" id="rgo">Replace my data</button></div>',
      function(w){
        w.querySelector("#rgo").onclick = function(){
          var raw = w.querySelector("#restorein").value.trim();
          var parsed;
          try{ parsed = JSON.parse(raw); }
          catch(e){ toast("That isn't a valid backup."); return; }
          w.remove();
          applyPack(parsed);
        };
      });
  }
  function showText(text){
    sheetOpen('<div class="when">Your day, as text</div>' +
      '<textarea id="dayout" style="min-height:260px"></textarea>' +
      '<div class="sheetbtns"><button class="ghost" data-close="1">Close</button></div>',
      function(w){
        var ta = w.querySelector("#dayout");
        ta.value = text; ta.select();
      });
  }

  /* ---------------- row menu + editor ---------------- */
  function openRowMenu(id, kind){
    var isHabit = kind === "habit";
    var o = (isHabit ? state.habits : state.tasks).filter(function(x){ return x.id === id; })[0];
    if(!o) return;
    var wrap = document.createElement("div");
    wrap.className = "scrim bottom";
    wrap.innerHTML = '<div class="menu">' +
      '<div class="menutitle">' + esc(o.title) + '</div>' +
      (isHabit ? '' :
        '<button class="mrow" data-act="star">' + (o.star ? "☆ Remove priority" : "★ Make it the priority") + '</button>' +
        (o.done ? '' : '<button class="mrow" data-act="push">→ Push to tomorrow</button>') +
        (o.date !== TODAY && !o.done ? '<button class="mrow" data-act="pull">↓ Pull into today</button>' : '')) +
      '<button class="mrow" data-act="edit">✎ Edit</button>' +
      '<button class="mrow danger" data-act="del">× Delete</button>' +
      '<button class="mrow cancel" data-act="close">Cancel</button>' +
    '</div>';
    document.body.appendChild(wrap);
    wrap.addEventListener("click", function(ev){
      if(ev.target === wrap) return wrap.remove();
      var b = ev.target.closest("[data-act]"); if(!b) return;
      var act = b.dataset.act;
      wrap.remove();
      if(act === "close") return;
      if(act === "edit") return openEditor(id, kind);
      if(act === "star"){ o.star = !o.star; save(); render(); return; }
      if(act === "push"){
        var from = o.date;
        o.date = shiftKey(TODAY, 1); save(); render();
        undoToast("Pushed to tomorrow", function(){ o.date = from; save(); render(); });
        return;
      }
      if(act === "pull"){
        var was = o.date;
        o.date = TODAY; save(); render();
        undoToast("Pulled into today", function(){ o.date = was; save(); render(); });
        return;
      }
      if(act === "del"){
        var where = isHabit ? "habits" : "tasks";
        state[where] = state[where].filter(function(x){ return x.id !== id; });
        save(); render();
        undoToast("Deleted \u201c" + (o.title.length > 22 ? o.title.slice(0,22) + "\u2026" : o.title) + "\u201d", function(){
          state[where].push(o); save(); render(); toast("Back.");
        });
      }
    });
  }
  function openEditor(id, kind){
    var isHabit = kind === "habit";
    var o = (isHabit ? state.habits : state.tasks).filter(function(x){ return x.id === id; })[0];
    if(!o) return;
    var days = (o.days || []).slice();
    var wrap = sheetOpen(
      '<div class="when">Edit ' + (isHabit ? "repeating task" : "task") + '</div>' +
      '<input type="text" id="etitle" class="bigin" maxlength="140">' +
      (isHabit
        ? '<div class="fl" style="margin-top:12px"><span>Which days? (none = every day)</span>' +
          '<div class="dayset" id="edays">' + DAYNAMES.map(function(n,i){
            return '<button class="dchip" data-eday="'+i+'" aria-pressed="'+(days.indexOf(i)!==-1)+'">'+n+'</button>';
          }).join('') + '</div></div>' +
          (state.goals.length ? '<label class="fl" style="margin-top:12px"><span>Goal</span><select id="egoal">' +
            '<option value="">Not linked</option>' +
            state.goals.map(function(g){ return '<option value="'+g.id+'"'+(o.goalId===g.id?" selected":"")+'>'+esc(g.title)+'</option>'; }).join("") +
            '</select></label>' : '')
        : '<div class="fieldrow" style="margin-top:12px">' +
            '<label class="fl"><span>Date</span><input type="date" id="edate" value="' + o.date + '"></label>' +
            '<label class="fl"><span>Time</span><input type="time" id="etime" value="' + (o.time || "") + '"></label>' +
          '</div>' +
          (state.goals.length ? '<label class="fl" style="margin-top:10px"><span>Goal</span><select id="egoal">' +
            '<option value="">Not linked</option>' +
            state.goals.map(function(g){ return '<option value="'+g.id+'"'+(o.goalId===g.id?" selected":"")+'>'+esc(g.title)+'</option>'; }).join("") +
            '</select></label>' : '')) +
      '<div class="sheetbtns"><button class="ghost" data-close="1">Cancel</button>' +
      '<button class="solid" id="esave">Save changes</button></div>',
      function(w){
        var ti = w.querySelector("#etitle");
        ti.value = o.title; ti.focus();
        var ed = w.querySelector("#edays");
        if(ed) ed.addEventListener("click", function(ev){
          var b = ev.target.closest("[data-eday]"); if(!b) return;
          var n = +b.dataset.eday, i = days.indexOf(n);
          if(i === -1) days.push(n); else days.splice(i,1);
          b.setAttribute("aria-pressed", String(days.indexOf(n) !== -1));
        });
        w.querySelector("#esave").onclick = function(){
          var v = ti.value.trim();
          if(!v){ ti.classList.add("nudgeme"); return; }
          o.title = v;
          var gEl = w.querySelector("#egoal");
          if(isHabit){
            o.days = days.slice();
            if(gEl) o.goalId = gEl.value;
          } else {
            var dEl = w.querySelector("#edate"), tEl = w.querySelector("#etime");
            if(dEl && dEl.value) o.date = dEl.value;
            o.time = tEl ? tEl.value : "";
            if(gEl) o.goalId = gEl.value;
          }
          save(); w.remove(); render(); toast("Updated.");
        };
      });
    return wrap;
  }

  /* ---------------- settings ---------------- */
  function openSettings(){
    var w = sheetOpen("", function(){});
    function paint(){
      var reps = state.habits.map(function(x){
        return '<div class="item"><div class="txt">' + esc(x.title) +
          '<span class="meta">' + (habitDaysLabel(x) || "every day") + (x.goalId ? " · " + esc(goalName(x.goalId)) : "") + '</span></div>' +
          '<button class="more" data-more="' + x.id + '" data-kind="habit" aria-label="More">⋯</button></div>';
      }).join("");
      w.querySelector(".sheet").innerHTML =
        '<div class="when">Settings</div>' +
        '<label class="fl" style="margin-top:10px"><span>What should Momentum call you?</span>' +
        '<input type="text" id="sname" class="bigin" style="margin-top:2px" maxlength="24"></label>' +
        '<div class="sechead" style="margin-top:18px"><b>Reminders</b></div>' + nudgeBarHTML() +
        '<div class="sechead"><b>Your repeating tasks</b><span>' + (state.habits.length || "none yet") + '</span></div>' +
        (reps || '<div class="empty">Nothing on repeat yet. Tap + and pick Repeats.</div>') +
        '<div class="sechead" style="margin-top:16px"><b>Backups</b><span>this device only</span></div>' +
        '<p style="margin:0 0 10px">Momentum keeps everything in this browser on this device. The text backup carries your goals, tasks, streaks and history. The file backup carries your pictures as well — use that one to move to another device.</p>' +
        '<button class="wide" id="backup">Copy a backup (text)</button>' +
        '<button class="wide" id="restore">Restore from text</button>' +
        '<button class="wide" id="backupfile">Send / save a full backup (with pictures)</button>' +
        '<button class="wide" id="restorefile">Load a backup file</button>' +
        '<div class="sechead" style="margin-top:16px"><b>How this works</b></div>' +
        '<p style="margin:0 0 8px">Your day rolls over at <b>4am</b>, not midnight — a late night still counts as the same day.</p>' +
        '<p style="margin:0 0 8px">A day counts toward your streak when you clear at least one thing <b>and</b> finish 60% of what was on the board. An empty board doesn\'t count.</p>' +
        '<div class="sechead" style="margin-top:16px"><b>Version</b></div>' +
        '<p style="margin:0">This app is build <b>' + BUILD + '</b>. <button type="button" class="linky" id="supd">Check for a newer one</button></p>' +
        '<div class="sheetbtns"><button class="ghost" data-close="1">Cancel</button>' +
        '<button class="solid" id="ssave">Save</button></div>';
      var ni = w.querySelector("#sname");
      ni.value = state.name || "";
      var x = w.querySelector("[data-close]");
      if(x) x.onclick = function(){ w.remove(); };
      var ub = w.querySelector("#supd");
      if(ub) ub.onclick = function(){
        ub.textContent = "Checking\u2026";
        liveBuild().then(function(v){
          if(!v){ ub.textContent = "No signal \u2014 try again on wifi"; return; }
          if(v === BUILD){ ub.textContent = "Already the newest one"; return; }
          ub.textContent = "New build " + v + " \u2014 loading it\u2026";
          try{ sessionStorage.removeItem("mom:got"); }catch(e){}
          takeUpdate();
        }).catch(function(){ ub.textContent = "No signal \u2014 try again on wifi"; });
      };
      w.querySelector("#backup").onclick = function(){ doBackup(); };
      w.querySelector("#restore").onclick = function(){ doRestore(); };
      w.querySelector("#backupfile").onclick = function(){ doBackupFile(); };
      w.querySelector("#restorefile").onclick = function(){ doRestoreFile(); };
      w.querySelector("#ssave").onclick = function(){
        state.name = ni.value.trim().slice(0,24);
        save(); w.remove(); render(); toast("Saved.");
      };
    }
    paint();
  }

  /* ---------------- recap ---------------- */
  function tomorrowCount(){
    var k = shiftKey(TODAY, 1);
    return state.tasks.filter(function(t){ return !t.done && t.date === k; }).length;
  }
  function openRecap(){
    var s = todayStats();
    var left = openTasks();
    var tier = s.total === 0 ? "zero" : s.rate >= 0.75 ? "strong" : s.rate >= 0.4 ? "mid" : "slow";
    sheetOpen(
      '<div class="when">Day closed · ' + new Date().toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"}) + '</div>' +
      '<h2>' + (s.done ? "You cleared " + s.done + "." : "Nothing cleared today.") + '</h2>' +
      '<div class="tally">' +
        '<div><b style="color:var(--mint)">' + s.done + '</b><span>done</span></div>' +
        '<div><b style="color:var(--amber)">' + left.length + '</b><span>left</span></div>' +
        '<div><b>' + Math.round(s.rate*100) + '%</b><span>of the day</span></div>' +
      '</div>' +
      '<p style="margin:0">' + pick(LINES[tier], TODAY + "r") + '</p>' +
      (tomorrowCount() ? '<p class="quiet" style="margin:10px 0 0">' + tomorrowCount() + ' already scheduled for tomorrow' + (left.length ? ', plus what you push across.' : '.') + '</p>' : '') +
      '<textarea id="recapnote" placeholder="One honest line about today — what worked, what got in the way."></textarea>' +
      '<div class="sheetbtns">' +
        '<button class="ghost" data-close="1">Not yet</button>' +
        '<button class="solid" id="rsave">Save' + (left.length ? " &amp; push " + left.length + " to tomorrow" : "") + '</button>' +
      '</div>',
      function(w){
        var note = w.querySelector("#recapnote");
        if(state.history[TODAY] && state.history[TODAY].note) note.value = state.history[TODAY].note;
        note.focus();
        w.querySelector("#rsave").onclick = function(){
          state.history[TODAY] = { done:s.done, total:s.total, rate:s.rate, note:note.value.trim() };
          left.forEach(function(t){ t.date = shiftKey(TODAY, 1); });
          save(); w.remove(); render();
          toast(left.length ? left.length + " moved to tomorrow" : "Day closed.");
        };
      });
  }

  /* ---------------- focus timer ---------------- */
  var timer = { running:false, left:25*60, id:null };
  function paintClock(){
    var c = document.getElementById("clock");
    if(!c) return;
    var m = Math.floor(timer.left/60), s = timer.left % 60;
    c.textContent = m + ":" + String(s).padStart(2,"0");
    var b = document.getElementById("tstart");
    if(b) b.textContent = timer.running ? "Pause" : (timer.left === 25*60 ? "Start" : "Resume");
    var l = document.getElementById("tlab");
    if(l) l.textContent = timer.running ? "Running — one task, no tabs." : "Focus block — one task, no tabs.";
  }
  function timerToggle(){
    timer.running = !timer.running;
    clearInterval(timer.id);
    if(timer.running){
      timer.id = setInterval(function(){
        timer.left--;
        if(timer.left <= 0){
          clearInterval(timer.id); timer.running = false; timer.left = 25*60;
          toast("Block done. Stand up, then go again.");
          fire("Focus block done", "25 minutes in the bank. Stretch, then line up the next one.", "focus");
        }
        paintClock();
      }, 1000);
    }
    paintClock();
  }
  function timerReset(){ clearInterval(timer.id); timer.running = false; timer.left = 25*60; paintClock(); }

  /* ---------------- boot + self-updates (mechanism unchanged) ---------------- */
  var BUILD = "v24";
  var lastCheck = 0, taking = false;
  function liveBuild(){
    return fetch("sw.js?ts=" + Date.now(), { cache: "no-store" })
      .then(function(r){ return r.text(); })
      .then(function(txt){ var m = txt.match(/momentum-(v\d+)/); return m ? m[1] : null; });
  }
  function takeUpdate(){
    if(taking) return;
    taking = true;
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration()
        .then(function(reg){ if(reg && reg.update) reg.update(); })
        .catch(function(){})
        .then(function(){ setTimeout(function(){ location.reload(); }, 700); });
    } else {
      location.reload();
    }
  }
  function pullUpdate(){
    var now = Date.now();
    if(taking || now - lastCheck < 20000) return;
    lastCheck = now;
    liveBuild().then(function(v){
      if(!v || v === BUILD) return;
      try{
        if(sessionStorage.getItem("mom:got") === v) return;
        sessionStorage.setItem("mom:got", v);
      }catch(e){}
      takeUpdate();
    }).catch(function(){});
  }
  if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
      pullUpdate();
    });
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) pullUpdate(); });
    window.addEventListener("pageshow", function(){ pullUpdate(); });
    window.addEventListener("focus", function(){ pullUpdate(); });
  }
  bindVV();

  document.addEventListener("keydown", function(ev){
    if(ev.key !== "Escape" && ev.key !== "Esc") return;
    var v = document.querySelector(".viewer #vx"); if(v){ v.click(); return; }
    var s = document.querySelectorAll(".scrim"); if(s.length){ s[s.length - 1].remove(); return; }
    var b = document.getElementById("bclose"); if(b){ b.click(); return; }
    var p = document.querySelector("[data-gback]"); if(p){ p.click(); return; }
  });

  (async function(){
    await load();
    await shotsLoad();
    rollover();
    render();
    sweep();
    setInterval(function(){
      if(todayKey() !== TODAY){ TODAY = todayKey(); fired = {}; dayPick = TODAY; rollover(); render(); }
      drawTop();
      sweep();
    }, 60000);
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden){
        if(todayKey() !== TODAY){ TODAY = todayKey(); fired = {}; dayPick = TODAY; rollover(); }
        render();
      }
    });
  })();
})();
</script>
</body>
